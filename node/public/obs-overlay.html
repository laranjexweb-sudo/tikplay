<script>
let state = { secretLength: 0, guesses: [], hintCount: 0, finished: false, secretWord: "", currentGameId: null, postGameSummary: null, ttsSettings: {} };
let ws = null;

function updateIdleState() {
  const el = document.getElementById("idleWaiting");
  if (el) el.style.display = (state.currentGameId && !state.finished) ? "none" : "block";
}

function updateSubtitle() {
  const el = document.getElementById("headerSubtitle");
  if (!el) return;
  const p = (state.ttsSettings && state.ttsSettings.command_prefix) || "#";
  if (p) el.innerHTML = `Digite <strong>${p}palavra</strong> no chat para chutar`;
  else el.innerHTML = `Digite a <strong>palavra</strong> no chat para chutar`;
}
const room = new URLSearchParams(location.search).get("room") || "";

function connectWS() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/browser?room=${encodeURIComponent(room)}`);
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    handleMessage(msg);
  };
  ws.onclose = () => setTimeout(connectWS, 3000);
}

connectWS();

let currentRiddleText = "";
let currentRiddleAudioUrl = "";
let riddleAudio = null;

function handleMessage(msg) {
  switch (msg.type) {
    case "python_connected":
    case "python_disconnected":
      loadGameState();
      break;

    case "game_start":
      guessHighlightQueue = [];
      guessHighlightShowing = false;
      dicaQueue = [];
      dicaShowing = false;

      state.secretLength = msg.secret_length;
      state.currentGameId = msg.game_id;
      state.guesses = [];
      state.finished = false;
      state.secretWord = "";
      state.postGameSummary = null;
      state.hintGifts = msg.hint_gifts || [];
      state.riddleGifts = msg.riddle_gifts || [];
      state.currentRiddleStage = 0;
      updateIdleState();
      document.getElementById("gameOverBanner").style.display = "none";
      closePostGameModal();
      enablePostGame();
      renderAllGifts(state.hintGifts, state.riddleGifts, 0);
      renderBoxes();
      renderGuesses();
      break;

    case "gift_config_updated":
      renderAllGifts(msg.hint_gifts || [], msg.riddle_gifts || [], state.currentRiddleStage || 0);
      break;

    case "guess":
      handleGuessHighlight(msg);
      break;

    case "guess_duplicate":
      highlightDuplicateRow(msg.word);
      break;

    case "gift_hint":
      if (msg.hint_word) {
        document.getElementById("hintCount").textContent = parseInt(document.getElementById("hintCount").textContent) + 1;
        showNotification(`ðŸ’¡ Dica: ${msg.hint_word}`, "#cc88ff");
        showDicaOverlay(msg.gift, msg.nickname || msg.user, msg.hint_word);
      }
      break;

    case "riddle_started":
      handleRiddleStarted(msg);
      break;

    case "riddle_ready":
      handleRiddleReady(msg);
      break;

    case "riddle_play":
      playRiddleSfxAndTimer();
      break;

    case "roulette_drop":
      if (msg.reward_type === "hint") {
        const hintCountEl = document.getElementById("hintCount");
        if (hintCountEl) {
          hintCountEl.textContent = parseInt(hintCountEl.textContent || "0") + 1;
        }
        showNotification(`ðŸ’¡ Dica: ${msg.hint_word}`, "#cc88ff");
        showDicaOverlay(msg.gift, msg.nickname || msg.user, msg.hint_word);
        handleGuessHighlight({
          word: msg.hint_word,
          rank: msg.hint_rank,
          user: msg.user,
          nickname: msg.nickname,
          avatar: msg.avatar,
          color: msg.color,
          is_hint: true,
          gift: msg.gift,
        });
      } else if (msg.reward_type === "riddle_started") {
        handleRiddleStarted(msg);
      } else if (msg.reward_type === "riddle_ready") {
        handleRiddleReady(msg);
      }
      break;

    case "game_over":
      // Queue victory event so it plays after the winning guess transition
      guessHighlightQueue.push({ is_game_over_event: true, msg });
      processGuessHighlightQueue();
      break;

    case "gift_event":
      playGiftSound(msg.gift, msg.repeat_count);
      break;

    case "sound_alerts_updated":
      loadSoundAlerts();
      break;
  }
}

// ---------------- Alertas Sonoros (OBS) ----------------
let obsSoundAlerts = {};
let obsSoundAudio = null;
const OBS_SOUND_EFFECT_GAP_MS = 250;
const OBS_MAX_ALERT_SECONDS = 10;
let obsSoundDurations = {};
let obsSoundEffectQueue = [];
let obsSoundEffectPlaying = false;
let obsSoundEffectGapTimer = null;

function enqueueObsSoundEffects(urls) {
  for (const u of urls) if (u) obsSoundEffectQueue.push(u);
  processObsSoundEffectQueue();
}

function processObsSoundEffectQueue() {
  if (obsSoundEffectPlaying) return;
  const url = obsSoundEffectQueue.shift();
  if (!url) return;
  obsSoundEffectPlaying = true;
  const a = new Audio(url);
  a.preload = "auto";
  a.onended = nextObsSoundEffect;
  a.onerror = nextObsSoundEffect;
  a.play().catch(nextObsSoundEffect);
  obsSoundAudio = a;
}

function nextObsSoundEffect() {
  obsSoundEffectPlaying = false;
  if (obsSoundEffectGapTimer) clearTimeout(obsSoundEffectGapTimer);
  obsSoundEffectGapTimer = setTimeout(processObsSoundEffectQueue, OBS_SOUND_EFFECT_GAP_MS);
}

function cacheObsSoundDuration(url) {
  if (!url || obsSoundDurations[url] !== undefined) return;
  try {
    const a = new Audio(url);
    a.preload = "metadata";
    a.onloadedmetadata = () => {
      obsSoundDurations[url] = isFinite(a.duration) ? a.duration : 0;
    };
  } catch {}
}

function cacheAllObsSoundDurations() {
  for (const entry of Object.values(obsSoundAlerts)) {
    cacheObsSoundDuration(entry.normal);
    cacheObsSoundDuration(entry.combo);
  }
}

function obsGiftByName(name) {
  const key = String(name || "").toLowerCase().trim();
  return giftTagList.find((t) => {
    const en = t.name.toLowerCase();
    const pt = getGiftPtName(t.name).toLowerCase();
    return en === key || pt === key;
  }) || null;
}

function resolveObsSoundEntry(gift) {
  const key = String(gift || "").trim();
  if (!key) return null;
  if (obsSoundAlerts[key]) return obsSoundAlerts[key];
  if (obsSoundAlerts[key.toLowerCase()]) return obsSoundAlerts[key.toLowerCase()];
  const g = obsGiftByName(key);
  if (g) {
    if (obsSoundAlerts[g.name]) return obsSoundAlerts[g.name];
    const pt = getGiftPtName(g.name);
    if (pt && obsSoundAlerts[pt]) return obsSoundAlerts[pt];
  }
  const ptRaw = getGiftPtName(key);
  if (ptRaw && ptRaw.toLowerCase() !== key.toLowerCase() && obsSoundAlerts[ptRaw]) return obsSoundAlerts[ptRaw];
  return null;
}

function computeObsNormalPlays(repeatCount, duration) {
  const secs = duration > 0 ? duration : 0;
  let maxPlays;
  if (secs > 0) {
    maxPlays = Math.max(1, Math.floor(OBS_MAX_ALERT_SECONDS / secs));
  } else {
    maxPlays = 5;
  }
  return Math.min(repeatCount, maxPlays);
}

function playGiftSound(gift, repeat_count) {
  const entry = resolveObsSoundEntry(gift);
  if (!entry) return;
  const repeatCount = Math.max(1, repeat_count || 1);
  if (repeatCount > 1 && entry.combo) {
    enqueueObsSoundEffects([entry.combo]);
    return;
  }
  if (!entry.normal) return;
  if (repeatCount > 1) {
    const duration = obsSoundDurations[entry.normal] || 0;
    const plays = computeObsNormalPlays(repeatCount, duration);
    const urls = [];
    for (let i = 0; i < plays; i++) urls.push(entry.normal);
    enqueueObsSoundEffects(urls);
  } else {
    enqueueObsSoundEffects([entry.normal]);
  }
}

async function loadSoundAlerts() {
  try {
    const res = await fetch(`/api/sound-alerts?room=${encodeURIComponent(room)}&` + Date.now());
    const data = await res.json();
    if (data.success) {
      obsSoundAlerts = data.alerts || {};
      cacheAllObsSoundDurations();
    }
  } catch (e) {}
}

function handleRiddleStarted(msg) {
  document.getElementById("winnersPanel").style.display = "none";
  const panel = document.getElementById("riddlePanel");
  panel.style.display = "block";
  document.getElementById("riddleLoading").style.display = "flex";
  document.getElementById("riddleBody").style.display = "none";
  document.getElementById("riddleFooter").style.display = "none";
}

function handleRiddleReady(msg) {
  state.currentRiddleStage = msg.stage;
  currentRiddleText = msg.text;
  currentRiddleAudioUrl = msg.audio_url || "";

  document.getElementById("riddleLoading").style.display = "none";
  document.getElementById("riddleBody").style.display = "block";
  document.getElementById("riddleFooter").style.display = "flex";
  document.getElementById("riddleUserInfo").textContent = `@${msg.nickname || msg.user}`;

  typewriterText("riddleText", msg.text, 30);
}

function playRiddleSfxAndTimer() {
  speakCurrentRiddle();
}

function closeRiddleCard() {
  if (riddleAudio) {
    riddleAudio.pause();
    riddleAudio = null;
  }
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  document.getElementById("riddlePanel").style.display = "none";
  document.getElementById("winnersPanel").style.display = "block";
  renderAllGifts(state.hintGifts, state.riddleGifts, state.currentRiddleStage);
}

let typewriterInterval = null;

function typewriterText(elementId, text, speed) {
  const el = document.getElementById(elementId);
  if (!el) return;
  if (typewriterInterval) clearInterval(typewriterInterval);
  el.textContent = "";
  let i = 0;
  typewriterInterval = setInterval(() => {
    if (i < text.length) {
      el.textContent += text.charAt(i);
      i++;
    } else {
      clearInterval(typewriterInterval);
      typewriterInterval = null;
    }
  }, speed);
}

let riddleVoicesCache = [];
function loadRiddleVoices() {
  if ('speechSynthesis' in window) riddleVoicesCache = window.speechSynthesis.getVoices() || [];
}
if ('speechSynthesis' in window) {
  loadRiddleVoices();
  window.speechSynthesis.onvoiceschanged = loadRiddleVoices;
}

function pickRiddleVoice(ttsSettings) {
  const voices = riddleVoicesCache;
  if (!voices.length) return null;
  const name = ((ttsSettings && ttsSettings.tts_voice) || "").trim().toLowerCase();
  if (name) {
    const byName = voices.find(v => (v.name || "").toLowerCase().includes(name));
    if (byName) return byName;
    const byLang = voices.find(v => (v.lang || "").toLowerCase().includes(name));
    if (byLang) return byLang;
  }
  return voices.find(v => (v.lang || "").toLowerCase().startsWith("pt")) || null;
}

function playRiddleAudio() {
  if (!currentRiddleAudioUrl) return;
  if (riddleAudio) riddleAudio.pause();
  riddleAudio = new Audio(currentRiddleAudioUrl);
  riddleAudio.play().catch(() => {});
}

function speakCurrentRiddle() {
  if (currentRiddleAudioUrl) {
    playRiddleAudio();
    return;
  }
  if (!currentRiddleText || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(currentRiddleText);
  utterance.lang = "pt-BR";
  const s = state.ttsSettings || {};
  utterance.rate = Number(s.tts_rate) || 1.0;
  utterance.pitch = 1.0;
  const voice = pickRiddleVoice(s);
  if (voice) utterance.voice = voice;
  window.speechSynthesis.speak(utterance);
}

function renderBoxes() {
  const container = document.getElementById("secretBoxes");
  container.innerHTML = "";
  for (let i = 0; i < state.secretLength; i++) {
    const box = document.createElement("div");
    box.className = "box";
    if (state.finished) {
      box.textContent = state.secretWord[i] || "?";
      box.classList.add("revealed");
    }
    container.appendChild(box);
  }
}

let guessHighlightQueue = [];
let guessHighlightShowing = false;

const GUESS_TOP_MS = 600;   // tempo destacado no topo
const GUESS_FLIP_MS = 300;  // duracao do deslize para a posicao
const GUESS_GAP_MS = 50;    // intervalo antes do proximo

function handleGuessHighlight(msg) {
  guessHighlightQueue.push(msg);
  processGuessHighlightQueue();
}

function processGuessHighlightQueue() {
  if (guessHighlightShowing || guessHighlightQueue.length === 0) return;
  guessHighlightShowing = true;

  const current = guessHighlightQueue.shift();

  if (current.is_game_over_event) {
    const msg = current.msg;
    state.finished = true;
    state.secretWord = msg.secret_word;
    state.postGameSummary = msg.post_game_summary || null;
    updateIdleState();
    document.getElementById("gameOverBanner").style.display = "block";
    document.getElementById("winnerName").innerHTML = `<img src="${msg.avatar || ''}" class="winner-av" onerror="this.style.display='none'"><span>ðŸ† ${msg.nickname || msg.winner} venceu!</span>`;
    renderBoxes();
    refreshRanking();
    if (state.postGameSummary) {
      renderPostGame();
    }
    enablePostGame();

    guessHighlightShowing = false;
    processGuessHighlightQueue();
    return;
  }
  
  // Render new guess at top (Position 1) in highlighted state
  const tempRow = renderNewGuessAtTop(current);
  if (!tempRow) {
    addGuessToList(current);
    guessHighlightShowing = false;
    processGuessHighlightQueue();
    return;
  }

  // Keep it at the top for 3 seconds
  setTimeout(() => {
    // Measure its first position (First)
    const firstRect = tempRow.getBoundingClientRect();
    tempRow.remove();

    // Add to list and render (Last)
    addGuessToList(current);

    // Run FLIP transition
    const finalRow = document.getElementById("just_added_row");
    if (finalRow) {
      const lastRect = finalRow.getBoundingClientRect();
      const deltaY = firstRect.top - lastRect.top;

      // Invert
      finalRow.style.transform = `translateY(${deltaY}px)`;
      finalRow.style.transition = "none";
      
      // Force layout repaint
      finalRow.offsetHeight;

      // Play (smooth slide to real position)
      finalRow.classList.add("guess-row-transitioning");
      finalRow.style.transform = "translateY(0)";

      setTimeout(() => {
        finalRow.classList.remove("guess-row-transitioning");
        finalRow.removeAttribute("id");
      }, GUESS_FLIP_MS);
    }

    guessHighlightShowing = false;
    setTimeout(processGuessHighlightQueue, GUESS_GAP_MS);
  }, GUESS_TOP_MS);
}

function renderNewGuessAtTop(msg) {
  const container = document.getElementById("guessesList");
  if (!container) return null;

  const row = document.createElement("div");
  row.className = `guess-row rank-${msg.color || "red"} new-guess-highlight`;

  const avatar = document.createElement("img");
  avatar.className = "guess-avatar";
  avatar.src = msg.avatar || "";
  avatar.alt = "";
  avatar.onerror = function() { this.style.display = "none"; };

  const rank = document.createElement("span");
  rank.className = "guess-rank";
  rank.textContent = `#${msg.rank}`;

  const word = document.createElement("span");
  word.className = "guess-word";
  word.textContent = msg.word;

  const dica = document.createElement("span");
  dica.className = "guess-dica";
  dica.textContent = "#DICA";

  const line = document.createElement("span");
  line.className = "guess-line";

  const nickname = document.createElement("span");
  nickname.className = "guess-nickname";
  nickname.textContent = "@" + (msg.nickname || msg.user || "?");

  row.appendChild(avatar);
  row.appendChild(rank);
  row.appendChild(word);
  if (msg.is_hint) row.appendChild(dica);
  row.appendChild(line);
  row.appendChild(nickname);

  container.insertBefore(row, container.firstChild);
  return row;
}

function highlightDuplicateRow(word) {
  const rows = document.querySelectorAll(".guess-row");
  for (const row of rows) {
    const wordEl = row.querySelector(".guess-word");
    if (wordEl && wordEl.textContent.toLowerCase() === word.toLowerCase()) {
      row.classList.remove("duplicate-glow");
      row.offsetHeight;
      row.classList.add("duplicate-glow");
      setTimeout(() => row.classList.remove("duplicate-glow"), 3000);
      break;
    }
  }
}

function addGuessToList(msg) {
  if (!msg || !msg.word) return;
  const exists = state.guesses.some(g => g.word.toLowerCase() === msg.word.toLowerCase());
  if (exists) return;

  // Use unshift to insert at the beginning of local guesses array, same behavior as original unshift!
  state.guesses.unshift({
    word: msg.word,
    rank: msg.rank,
    user: msg.user,
    nickname: msg.nickname || msg.user,
    avatar: msg.avatar || "",
    color: msg.color,
    is_hint: !!msg.is_hint,
    gift: msg.gift || null,
    justAdded: true
  });
  document.getElementById("guessCount").textContent = state.guesses.length;
  renderGuesses();
  renderAllGifts(state.hintGifts, state.riddleGifts, state.currentRiddleStage || 0);

  if (msg.rank === 1) {
    showNotification(`${msg.nickname || msg.user} acertou!`, "green");
  } else if (msg.rank <= 50) {
    showNotification(`${msg.nickname || msg.user}: ${msg.word} (#${msg.rank})`, "lime");
  }
}

function renderGuesses() {
  const container = document.getElementById("guessesList");
  container.innerHTML = "";
  const top = state.guesses.slice(0, 20);
  top.sort((a, b) => a.rank - b.rank);
  for (const g of top) {
    const row = document.createElement("div");
    row.className = `guess-row rank-${g.color || "red"}`;
    if (g.justAdded) {
      row.id = "just_added_row";
      row.classList.add("row-flash-active");
      g.justAdded = false;
    }

    const avatar = document.createElement("img");
    avatar.className = "guess-avatar";
    avatar.src = g.avatar;
    avatar.alt = "";
    avatar.onerror = function() { this.style.display = "none"; };

    const rank = document.createElement("span");
    rank.className = "guess-rank";
    rank.textContent = `#${g.rank}`;

    const word = document.createElement("span");
    word.className = "guess-word";
    word.textContent = g.word;

    const dica = document.createElement("span");
    dica.className = "guess-dica";
    dica.textContent = "#DICA";

    const line = document.createElement("span");
    line.className = "guess-line";

    const nickname = document.createElement("span");
    nickname.className = "guess-nickname";
    nickname.textContent = g.nickname;

    row.appendChild(avatar);
    row.appendChild(rank);
    row.appendChild(word);
    if (g.is_hint) row.appendChild(dica);
    row.appendChild(line);
    row.appendChild(nickname);
    container.appendChild(row);
  }
}

function renderPostGame() {
  const summary = state.postGameSummary;
  const list = document.getElementById("pgList");
  const sub = document.getElementById("pgpSub");
  if (!summary || !summary.palavras) {
    list.innerHTML = '<div class="pg-row pg-empty">Resumo indisponivel</div>';
    sub.textContent = "";
    return;
  }
  sub.textContent = `Game #${state.currentGameId || ""} Â· ${summary.total_palavras_capturadas || 0} palpites capturados`;
  list.innerHTML = "";
  for (const item of summary.palavras) {
    const row = document.createElement("div");
    row.className = "pg-row" + (item.rank_proximidade === 1 ? " pg-top" : "");

    const rank = document.createElement("span");
    rank.className = "pg-rank";
    rank.textContent = `#${item.rank_proximidade}`;

    const word = document.createElement("span");
    word.className = "pg-word";
    word.textContent = item.palavra;

    const dica = document.createElement("span");
    dica.className = "pg-dica";
    dica.textContent = "#DICA";

    const line = document.createElement("span");
    line.className = "pg-line";

    row.appendChild(rank);
    row.appendChild(word);
    row.appendChild(line);

    if (item.chutado && item.avatar) {
      const av = document.createElement("img");
      av.className = "pg-avatar";
      av.src = item.avatar;
      av.alt = "";
      av.onerror = function () { this.style.display = "none"; };
      row.appendChild(av);
    }

    const user = document.createElement("span");
    user.className = "pg-user";
    user.textContent = item.chutado ? (item.nickname || item.usuario || "") : "â€”";
    row.appendChild(user);

    if (item.is_hint) row.appendChild(dica);

    list.appendChild(row);
  }
}

let rankingMode = "weekly";

async function fetchWinners() {
  try {
    const res = await fetch(`/api/winners?room=${encodeURIComponent(room)}&` + Date.now());
    const data = await res.json();
    renderWinners(data.ranking || []);
  } catch (e) {
    // ignore
  }
}

async function fetchLiveRanking() {
  try {
    const res = await fetch(`/api/ranking-live?room=${encodeURIComponent(room)}&` + Date.now());
    const data = await res.json();
    renderWinners(data.ranking || []);
  } catch (e) {
    renderWinners([]);
  }
}

function cycleRankingMode() {
  if (rankingMode === "weekly") rankingMode = "live";
  else if (rankingMode === "live") rankingMode = "guesses";
  else rankingMode = "weekly";
  refreshRanking();
}

function refreshRanking() {
  const titleEl = document.getElementById("rankTitle");
  if (titleEl) {
    if (rankingMode === "weekly") titleEl.textContent = "RANKING SEMANAL â–¸";
    else if (rankingMode === "live") titleEl.textContent = "RANKING DA LIVE â–¸";
    else titleEl.textContent = "MAIS PALPITES (PARTIDA) â–¸";
  }
  if (rankingMode === "weekly") fetchWinners();
  else if (rankingMode === "live") fetchLiveRanking();
  else renderGuessesRanking();
}

function renderGuessesRanking() {
  const container = document.getElementById("winnersContainer");
  if (!container) return;
  container.innerHTML = "";
  const stats = {};
  for (const g of (state.guesses || [])) {
    if (!g.user) continue;
    const key = g.user;
    if (!stats[key]) stats[key] = { nickname: g.nickname || g.user, count: 0, avatar: g.avatar || "" };
    stats[key].count++;
  }
  const sorted = Object.values(stats).sort((a, b) => b.count - a.count || a.nickname.localeCompare(b.nickname)).slice(0, 10);
  if (!sorted.length) {
    container.innerHTML = `<div style="color:#555;padding:10px;text-align:center">Nenhum palpite ainda</div>`;
    return;
  }
  sorted.forEach((s, idx) => {
    const entry = document.createElement("div");
    entry.className = "winner-entry" + (idx === 0 ? " first" : "");
    const avatar = document.createElement("img");
    avatar.className = "winner-avatar";
    avatar.src = s.avatar || "";
    avatar.alt = "";
    avatar.onerror = function() { this.style.display = "none"; };
    const name = document.createElement("span");
    name.className = "winner-name";
    if (idx === 0) {
      const medal = document.createElement("span");
      medal.className = "winner-medal";
      medal.textContent = "🥇";
      entry.appendChild(medal);
    }
    name.textContent = s.nickname || "";
    const count = document.createElement("span");
    count.className = "winner-guesses";
    count.textContent = "x" + s.count;
    entry.appendChild(avatar);
    entry.appendChild(name);
    entry.appendChild(count);
    container.appendChild(entry);
  });
}

function renderWinners(ranking) {
  const container = document.getElementById("winnersContainer");
  container.innerHTML = "";
  ranking.forEach((s, idx) => {
    const entry = document.createElement("div");
    entry.className = "winner-entry" + (idx === 0 ? " first" : "");

    const avatar = document.createElement("img");
    avatar.className = "winner-avatar";
    avatar.src = s.avatar || "";
    avatar.alt = "";
    avatar.onerror = function() { this.style.display = "none"; };

    const name = document.createElement("span");
    name.className = "winner-name";
    if (idx === 0) {
      const medal = document.createElement("span");
      medal.className = "winner-medal";
      medal.textContent = "🥇";
      entry.appendChild(medal);
    }
    name.textContent = (s.winner || s.nickname || "");

    const wins = document.createElement("span");
    wins.className = "winner-guesses";
    wins.textContent = "x" + s.wins;

    entry.appendChild(avatar);
    entry.appendChild(name);
    entry.appendChild(wins);
    container.appendChild(entry);
  });
}

function showNotification(text, color) {
  const el = document.createElement("div");
  el.className = "guess-notification";
  el.style.borderColor = color;
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => { el.remove(); }, 4000);
}

async function loadGameState() {
  try {
    if (!giftImageMap || !Object.keys(giftImageMap).length) {
      await loadGiftImageMap();
    }
    const res = await fetch(`/api/game-state?room=${encodeURIComponent(room)}`);
    const gs = await res.json();
    state.ttsSettings = gs.settings || {};
    updateSubtitle();
    state.hintGifts = gs.hint_gifts || [];
    state.riddleGifts = gs.riddle_gifts || [];
    state.currentRiddleStage = gs.current_riddle_stage || 0;
    renderAllGifts(state.hintGifts, state.riddleGifts, state.currentRiddleStage);
    if (gs.active && gs.game_id) {
      state.currentGameId = gs.game_id;
      state.secretLength = gs.secret_length;
      state.guesses = gs.guesses || [];
      state.hintCount = (gs.hints || []).length;
      state.finished = gs.finished;
      state.secretWord = gs.secret_word || "";

      document.getElementById("guessCount").textContent = state.guesses.length;
      document.getElementById("hintCount").textContent = state.hintCount;

      if (gs.finished && gs.winner) {
        state.postGameSummary = gs.post_game_summary || null;
        document.getElementById("gameOverBanner").style.display = "block";
        const winAvatar = gs.guesses && gs.guesses.find(g => g.word === gs.secret_word);
        const avUrl = winAvatar ? (winAvatar.avatar || '') : '';
        document.getElementById("winnerName").innerHTML = `<img src="${avUrl}" class="winner-av" onerror="this.style.display='none'"><span>ðŸ† ${gs.winner} venceu!</span>`;
        if (state.postGameSummary) {
          renderPostGame();
        }
      }
      enablePostGame();

      renderBoxes();
      renderGuesses();
    }
    updateIdleState();
  } catch (e) {
    // ignore
  }
}

function enablePostGame() {
  const wrap = document.getElementById("postGameBtnWrap");
  if (wrap) {
    wrap.style.display = (state.finished && state.postGameSummary) ? "block" : "none";
  }
}

function openPostGameModal() {
  renderPostGame();
  const modal = document.getElementById("postGameModal");
  if (modal) modal.style.display = "flex";
}

function closePostGameModal() {
  const modal = document.getElementById("postGameModal");
  if (modal) modal.style.display = "none";
}

loadGameState();
refreshRanking();
renderBoxes();
loadSoundAlerts();
</script>

<div id="dicaOverlay" class="dica-overlay" style="display:none">
  <div class="dica-backdrop"></div>
  <div class="dica-content">
    <div class="dica-badge">DICA ATIVADA</div>
    <img class="dica-gift-image" id="dicaGiftImage" src="" alt="Gift">
    <div class="dica-user" id="dicaUser"></div>
    <div class="dica-word-label">Dica</div>
    <div class="dica-word" id="dicaWord"></div>
    <div class="dica-countdown"><div class="dica-countdown-bar"></div></div>
  </div>
</div>

<script>
let giftImageMap = {};
let giftTagList = [];

async function loadGiftImageMap() {
  try {
    const res = await fetch("/api/gift-image-map");
    const data = await res.json();
    if (data.success) giftImageMap = data.map || {};
  } catch {}
}

async function loadGiftTags() {
  try {
    const res = await fetch("/api/gift-tags");
    const data = await res.json();
    if (data.success) giftTagList = data.gifts || [];
  } catch {}
}

function getGiftDiamonds(gName) {
  const found = giftTagList.find(t => t.name.toLowerCase() === gName.toLowerCase());
  return found ? Number(found.diamond_count) || 1 : 1;
}

function getGiftLevel(gName, hintGifts) {
  if (!hintGifts || hintGifts.length <= 1) return "MÃ‰DIA";
  const diamonds = hintGifts.map(getGiftDiamonds);
  const minD = Math.min(...diamonds);
  const maxD = Math.max(...diamonds);
  if (maxD === minD) return "MÃ‰DIA";
  const d = getGiftDiamonds(gName);
  const ratio = (d - minD) / (maxD - minD || 1);
  if (ratio <= 0.25) return "LONGE";
  if (ratio <= 0.5) return "MÃ‰DIA";
  return "PRÃ“XIMA";
}

let highlightInterval = null;
let currentHighlightIdx = 0;

function startSequentialHighlight() {
  if (highlightInterval) clearInterval(highlightInterval);
  const cards = document.querySelectorAll(".dica-card");
  if (!cards || cards.length === 0) return;

  cards.forEach(card => card.classList.remove("highlight-scan"));
  const activeCard = cards[currentHighlightIdx % cards.length];
  if (activeCard) activeCard.classList.add("highlight-scan");

  highlightInterval = setInterval(() => {
    const cards = document.querySelectorAll(".dica-card");
    if (!cards || cards.length === 0) return;
    cards.forEach(card => card.classList.remove("highlight-scan"));
    currentHighlightIdx = (currentHighlightIdx + 1) % cards.length;
    const activeCard = cards[currentHighlightIdx];
    if (activeCard) activeCard.classList.add("highlight-scan");
  }, 3000);
}

loadGiftImageMap();
loadGiftTags();

let dicaQueue = [];
let dicaShowing = false;

function showDicaOverlay(giftName, user, hintWord) {
  try {
    dicaQueue.push({ giftName, user, hintWord });
    processDicaQueue();
  } catch (err) {
    console.error("Erro em showDicaOverlay:", err);
    showNotification("Erro na Dica: " + err.message, "red");
  }
}

function processDicaQueue() {
  try {
    if (dicaShowing || dicaQueue.length === 0) return;
    dicaShowing = true;

    const current = dicaQueue.shift();
    const overlay = document.getElementById("dicaOverlay");
    if (!overlay) {
      dicaShowing = false;
      return;
    }

    const img = document.getElementById("dicaGiftImage");
    const userEl = document.getElementById("dicaUser");
    const wordEl = document.getElementById("dicaWord");

    const filename = giftImageMap[current.giftName];
    if (img) {
      img.src = filename ? `/gift-images/${filename}` : "";
      img.style.display = filename ? "block" : "none";
    }
    if (userEl) userEl.textContent = current.user;
    if (wordEl) wordEl.textContent = current.hintWord;

    // Reset countdown bar animation
    const countdownBar = overlay.querySelector(".dica-countdown-bar");
    if (countdownBar) {
      countdownBar.style.animation = "none";
      countdownBar.offsetHeight; // trigger reflow
      countdownBar.style.animation = "";
    }

    overlay.classList.remove("hiding");
    overlay.style.display = "flex";

    setTimeout(() => {
      overlay.classList.add("hiding");
      setTimeout(() => {
        overlay.style.display = "none";
        dicaShowing = false;
        setTimeout(processDicaQueue, 400);
      }, 500);
    }, 5000);
  } catch (err) {
    console.error("Erro em processDicaQueue:", err);
    showNotification("Erro no processamento da Dica: " + err.message, "red");
    dicaShowing = false;
  }
}

</script>
