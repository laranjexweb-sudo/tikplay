<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikPlay — Duelo 1x1</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; background: #000; overflow: hidden; }
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: #101014;
    background-image: var(--scene-bg, url('/duelo/brasilia.png'));
    background-repeat: no-repeat;
    background-position: center bottom;
    background-size: cover;
    --score-x: 50; --score-y: 5; --score-scale: 1;
    --fh-x: 2; --fh-y: 14; --fh-scale: 1;
    --lh-x: 98; --lh-y: 14; --lh-scale: 1;
    --fg-x: 2; --fg-y: 32; --fg-scale: 1;
    --lg-x: 98; --lg-y: 32; --lg-scale: 1;
    --fire-y: 20; --fire-scale: 0.9; --fire-gap: 9vh;
  }

  .fighter-wrap { position: absolute; left: 52.5%; bottom: calc(var(--fire-y) * 1%); transform: scale(var(--fire-scale)); transform-origin: bottom center; width: auto; z-index: 1; }
  .fighter-wrap.attacking, .fighter-wrap.fronting { z-index: 15; }
  .fighter { position: relative; width: auto; will-change: transform; z-index: 1; }
  .fighter.attacking { z-index: 12; }
  .fighter.winner { z-index: 14; filter: drop-shadow(0 0 22px rgba(255, 210, 0, 0.9)); }
  .fighter.winner img { animation: winBounce .65s ease; }
  .fighter.victory-enter { animation: victoryPop .7s ease-out; }
  .fighter.down { z-index: 1; transform-origin: bottom center; animation: knockedDown 1.1s ease forwards; }
  @keyframes winBounce { 0%, 100% { transform: scale(1.15) translateY(-14px); } 50% { transform: scale(1.24) translateY(-24px); } }
  @keyframes victoryPop { 0% { transform: scale(.8) translateY(24px); opacity: .4; } 60% { transform: scale(1.18) translateY(-20px); opacity: 1; } 100% { transform: scale(1.08) translateY(-8px); opacity: 1; } }
  @keyframes knockedDown {
    0% { transform: rotate(0deg) translateY(0); opacity: 1; filter: none; }
    100% { transform: rotate(-92deg) translateX(-6%) translateY(26%); opacity: 0.3; filter: grayscale(0.85); }
  }
  .fighter img { display: block; max-height: 32vh; width: auto; transform-origin: bottom center; }
  .fighter:not(.attacking):not(.winner):not(.down) img { animation: breath 3s ease-in-out infinite; }
  .fighter.idleState img { animation-duration: 2.6s; }
  @keyframes breath { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-3px) scaleY(1.012); } }
  #wrap-flavio { margin-left: calc(clamp(10vh, 14vh, 17vh) * -1 - var(--fire-gap)); }
  #wrap-lula  { margin-left: calc(clamp(10vh, 14vh, 17vh) * -1 + var(--fire-gap)); transform: scale(calc(var(--fire-scale) * 0.92)); transform-origin: bottom center; }

  .lb-score {
    position: absolute;
    left: calc(var(--score-x) * 1%);
    top: calc(var(--score-y) * 1%);
    transform: translateX(-50%) scale(var(--score-scale));
    transform-origin: top center;
    z-index: 31;
    pointer-events: none;
    width: min(80vw, 580px);
    padding: 7px 14px 5px;
    background: rgba(8, 13, 26, 0.9);
    border: 3px solid #c9a227;
    border-top-color: #f0c84a;
    border-radius: 12px;
    box-shadow: inset 0 0 0 1px #000, 4px 4px 0 rgba(0,0,0,0.45);
  }
  .sb-row { display: flex; align-items: center; gap: 12px; }
  .sb-val {
    font-weight: 900;
    font-size: clamp(1.15rem, 3.2vh, 2.1rem);
    min-width: 86px;
    text-align: center;
    letter-spacing: 1px;
    white-space: nowrap;
    text-shadow: 2px 2px 0 #000;
  }
  .sb-val.flavio { color: #5bc0ff; }
  .sb-val.lula { color: #ff6b6b; }
  .sb-meta {
    margin-top: 3px;
    text-align: center;
    font-size: clamp(0.58rem, 1.4vh, 0.82rem);
    color: #f0d488;
    text-shadow: 1px 1px 0 #000;
    font-weight: 800;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .sb-bar { position: relative; flex: 1; height: clamp(14px, 2.1vh, 24px); background: rgba(255,255,255,0.12); border-radius: 8px; overflow: hidden; border: 2px solid #000; box-shadow: inset 0 2px 0 rgba(0,0,0,.4); }
  .sb-bar .seg { position: absolute; top: 0; bottom: 0; display: block; transition: width .4s ease; }
  .sb-bar .seg.flavio { left: 0; background: linear-gradient(90deg, #1f6feb, #5bc0ff); }
  .sb-bar .seg.lula { right: 0; background: linear-gradient(90deg, #c0392b, #ff6b6b); }
  .sb-bar .sb-mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 3px; background: #ffd200; box-shadow: 0 0 6px #ffd200; }
  .sb-num { position: absolute; top: 50%; transform: translateY(-50%); font-size: clamp(0.6rem, 1.4vh, 0.85rem); font-weight: 900; color: #fff; text-shadow: 1px 1px 0 #000; z-index: 2; white-space: nowrap; }
  .sb-num.flavio { left: 4px; }
  .sb-num.lula { right: 4px; }
  .lb-score.pulse .sb-row { animation: scorePulse .4s ease; }
  @keyframes scorePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

  .hud-flavio, .hud-lula {
    position: absolute;
    z-index: 30;
    pointer-events: none;
    padding: 10px 14px;
    border-radius: 16px;
    background: rgba(8, 8, 14, 0.62);
    border: 2px solid rgba(255, 255, 255, 0.18);
  }
  .hud-flavio { left: calc(var(--fh-x) * 1%); top: calc(var(--fh-y) * 1%); transform: scale(var(--fh-scale)); transform-origin: top left; }
  .hud-lula { left: calc(var(--lh-x) * 1%); top: calc(var(--lh-y) * 1%); transform: translateX(-100%) scale(var(--lh-scale)); transform-origin: top right; }

  .gift-panel {
    position: absolute;
    z-index: 30;
    pointer-events: none;
    padding: 5px 7px;
    border-radius: 10px;
    background: rgba(8, 13, 26, 0.94);
    border: 2px solid #000;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.4);
  }
  .gift-panel-flavio { left: calc(var(--fg-x) * 1%); top: calc(var(--fg-y) * 1%); transform: scale(var(--fg-scale)); transform-origin: top left; border-left: 5px solid #2f7bd9; }
  .gift-panel-lula { left: calc(var(--lg-x) * 1%); top: calc(var(--lg-y) * 1%); transform: translateX(-100%) scale(var(--lg-scale)); transform-origin: top right; border-right: 5px solid #d64545; }
  .gift-panel .gift-tags { margin-top: 0; }
  .hud-name { font-weight: 900; font-size: clamp(1.05rem, 2.8vh, 1.9rem); letter-spacing: 3px; color: #fff; text-shadow: 0 0 8px #000, 0 0 16px rgba(0,0,0,0.6); margin-bottom: 6px; }
  .hud-metric { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; min-width: 0; font-size: clamp(0.72rem, 1.7vh, 1rem); }
  .hud-metric .hm-label { font-weight: 800; color: #c9d7f0; text-shadow: 0 0 6px #000; letter-spacing: 1px; white-space: nowrap; }
  .hud-metric .hm-val { font-weight: 900; color: #fff; text-shadow: 0 0 6px #000; white-space: nowrap; }
  .hud-lula .hud-metric { flex-direction: row-reverse; }

  .bar { width: 100%; height: clamp(12px, 1.7vh, 18px); border-radius: 999px; background: rgba(0,0,0,0.55); border: 2px solid #000; overflow: hidden; margin: 4px 0 2px; position: relative; }
  .bar > i { display: block; height: 100%; width: 100%; transition: width .3s ease; border-radius: 999px; }
  .hud-flavio .bar.sh, .hud-lula .bar.sh { margin-top: 9px; }
  .hud-debates { display: flex; align-items: baseline; gap: 6px; margin-top: 8px; font-size: clamp(0.66rem, 1.6vh, 0.95rem); font-weight: 800; color: #fff; text-shadow: 0 0 6px #000; white-space: nowrap; }
  .hud-debates .hdl { letter-spacing: 1px; color: #c9d7f0; }
  .hud-debates .hdn.flavio { color: #5bc0ff; }
  .hud-debates .hdn.lula { color: #ff6b6b; }
  .hud-lula .hud-debates { justify-content: flex-end; }
  .bar > span.label-in {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    z-index: 2; font-size: clamp(0.68rem, 1.6vh, 1rem); font-weight: 800;
    color: #fff; text-shadow: 0 0 4px #000, 0 0 12px #000; letter-spacing: 2px; pointer-events: none; white-space: nowrap;
  }
  .bar.hp > i { background: linear-gradient(90deg, #c0392b, #ff6b6b); }
  .hud-flavio .bar.hp > i { background: linear-gradient(90deg, #1f6feb, #5bc0ff); }
  .hud-lula .bar.hp > i { background: linear-gradient(90deg, #c0392b, #ff6b6b); }
  .bar.sh > i { background: linear-gradient(90deg, #2b3a5c, #5b7aa8); }
  .bar-label { font-size: clamp(0.62rem, 1.7vw, 0.9rem); color: #cfe0ff; text-shadow: 0 0 6px #000; font-weight: 700; }
  .gift-tags { display: flex; flex-direction: column; gap: 3px; }
  .gift-tag {
    display: flex; align-items: center; gap: 7px; width: fit-content; max-width: 100%;
    font-size: clamp(0.68rem, 1.6vh, 0.95rem); font-weight: 800;
    padding: 3px 8px 3px 3px; border-radius: 7px; letter-spacing: 0.3px;
    color: #fff; background: rgba(255,255,255,0.05);
    overflow: hidden; white-space: nowrap;
  }
  .gift-panel-lula .gift-tag { align-self: flex-end; }
  .gift-tag img { width: clamp(18px, 2.4vh, 26px); height: clamp(18px, 2.4vh, 26px); object-fit: contain; border-radius: 4px; }
  .gift-tag .gift-icon { font-size: 1.05em; line-height: 1; }
  .gift-tag .gift-effect { color: #ffd200; text-shadow: 1px 1px 0 #000; }

  .win-banner {
    position: absolute;
    top: 34%;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 70;
    opacity: 0;
    transform: translateY(-50%);
    transition: opacity .25s ease;
    pointer-events: none;
  }
  .win-banner.show { opacity: 1; }
  .win-banner .banner-img { animation: bannerPop .45s ease; }
  .win-banner .big { display: none; }
  .win-banner .sub { display: none; }

  .shield-fx { position: absolute; bottom: calc(var(--fire-y) * 1%); width: 0; height: 0; pointer-events: none; opacity: 0; }
  .shield-fx.show { opacity: 1; animation: shieldBurst .8s ease-out forwards; }
  .shield-fx.left  { left: 52.5%; margin-left: calc(clamp(10vh, 14vh, 17vh) * -1 - var(--fire-gap)); }
  .shield-fx.right { left: 52.5%; margin-left: calc(clamp(10vh, 14vh, 17vh) * -1 + var(--fire-gap)); }
  @keyframes shieldBurst { 0% { box-shadow: 0 0 0 0 rgba(91,192,255,0.8); } 100% { box-shadow: 0 0 0 18vmax rgba(91,192,255,0); } }
  .float-text {
    position: absolute;
    bottom: 46vh;
    left: 50%;
    transform: translateX(-50%);
    font-weight: 900;
    font-size: clamp(1.1rem, 3vw, 1.8rem);
    color: #7fd7ff;
    text-shadow: 0 0 14px rgba(0,120,255,0.9);
    z-index: 45;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
  }
  .float-text.show { animation: floatUp 1s ease-out forwards; }
  @keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 10px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -40px); } }

  .combat-shake { animation: shk .25s linear; }
  @keyframes shk { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-6px,2px); } 60% { transform: translate(6px,-2px); } }

  .hit { position: absolute; bottom: 22vh; left: 50%; z-index: 20; width: 0; height: 0; opacity: 0; pointer-events: none; }

  #supporterWrap { position: absolute; z-index: 13; bottom: calc(var(--fire-y) * 1%); display: none; }
  #supporterWrap.side-flavio { left: 52.5%; margin-left: calc(clamp(10vh, 14vh, 17vh) * -1 - var(--fire-gap)); }
  #supporterWrap.side-lula { left: 52.5%; margin-left: calc(clamp(10vh, 14vh, 17vh) * -1 + var(--fire-gap)); }
  #supporterImg { display: block; max-height: calc(32vh * var(--fire-scale)); max-width: 38vw; width: auto; transform-origin: bottom center; }
  #supporterWrap.enter { display: block; animation: supEnter .35s ease; }
  #supporterWrap.exit { animation: supExit .3s ease forwards; }
  @keyframes supEnter { 0% { opacity: 0; transform: translateX(-46px) scale(.92); } 100% { opacity: 1; transform: translateX(0) scale(1); } }
  @keyframes supExit { 0% { opacity: 1; transform: translateX(0) scale(1); } 100% { opacity: 0; transform: translateX(46px) scale(.9); } }
  #supporterWrap.side-lula.enter { animation-name: supEnterR; }
  #supporterWrap.side-lula.exit { animation-name: supExitR; }
  @keyframes supEnterR { 0% { opacity: 0; transform: translateX(46px) scale(.92); } 100% { opacity: 1; transform: translateX(0) scale(1); } }
  @keyframes supExitR { 0% { opacity: 1; transform: translateX(0) scale(1); } 100% { opacity: 0; transform: translateX(-46px) scale(.9); } }
  #supporterBubble { position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); z-index: 45; }
  #supporterBubble img { max-height: clamp(34px, 6.5vh, 60px); }
  .hit.show { opacity: 1; }
  .hit.punch { border-left: 46px solid transparent; border-right: 46px solid transparent; border-bottom: 60px solid #fff8d0; animation: hitPunch .28s ease-out forwards; }
  .hit.kick { width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle, #fff 0%, #ffd200 40%, rgba(255,180,0,0) 70%); animation: hitKick .3s ease-out forwards; }
  .hit.uppercut { width: 6px; height: 140px; background: linear-gradient(#fff, #ff8800); border-radius: 4px; box-shadow: 0 0 26px #ff8800; animation: hitUppercut .34s ease-out forwards; }
  @keyframes hitPunch { 0% { transform: translate(-50%,0) scale(.4); opacity: 1; } 100% { transform: translate(-50%,-6vh) scale(1.15); opacity: 0; } }
  @keyframes hitKick { 0% { transform: translate(-50%,0) scale(.5); opacity: 1; } 100% { transform: translate(-50%,-8vh) scale(1.5); opacity: 0; } }
  @keyframes hitUppercut { 0% { transform: translate(-50%,0); opacity: 1; } 100% { transform: translate(-50%,-14vh); opacity: 0; } }

  .status { position: absolute; top: clamp(22px, 2vh, 44px); right: 4vw; z-index: 30; font-size: 0.8rem; color: #9aa; text-shadow: 0 0 8px #000; }

  .f-anchor { position: absolute; left: 50%; pointer-events: none; }
  .f-speech {
    bottom: calc(100% + 8px);
    z-index: 44;
    opacity: 0;
    transform: translate(-50%, 8px);
    transition: opacity .2s ease, transform .2s ease;
  }
  .f-speech.show { opacity: 1; transform: translate(-50%, 0); }
  .f-speech .speech-img { display: block; max-height: clamp(64px, 14vh, 130px); width: auto; }
  .f-vote { bottom: 62%; z-index: 46; }

  .vote-float {
    position: absolute;
    z-index: 46;
    font-weight: 900;
    font-size: clamp(1.1rem, 3vh, 1.7rem);
    color: #ffd200;
    text-shadow: 0 0 10px rgba(255, 170, 0, 0.9), 0 0 3px #000;
    pointer-events: none;
    transform: translate(-50%, 0);
    white-space: nowrap;
    animation: voteUp 1.4s ease-out forwards;
  }
  .vote-float.sh { color: #7fd7ff; text-shadow: 0 0 10px rgba(91,192,255,0.9), 0 0 3px #000; }
  .vote-float.combo { color: #fff; background: rgba(0,0,0,0.6); border: 2px solid #ffd200; border-radius: 12px; padding: 2px 12px; }
  .vote-float.dmg { color: #ff8a5c; }
  .vote-float.flavio { color: #5bc0ff; }
  .vote-float.lula { color: #ff6b6b; }
  @keyframes voteUp { 0% { opacity: 0; transform: translate(-50%, 14px) scale(.9); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -72px) scale(1.08); } }

  .lead-flash {
    position: absolute;
    top: 36%;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 70;
    opacity: 0;
    transform: translateY(-50%);
    transition: opacity .2s ease;
    pointer-events: none;
  }
  .lead-flash.show { opacity: 1; }
  .banner-img { display: block; max-width: min(74vw, 640px); max-height: 56vh; object-fit: contain; }
  .lead-flash .banner-img { animation: bannerPop .35s ease; }
  @keyframes bannerPop { 0% { transform: scale(.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

  @keyframes scorePulse { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .debug { position: absolute; bottom: 2vh; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; gap: 8px; background: rgba(0,0,0,0.6); border: 2px solid #555; border-radius: 12px; padding: 8px 10px; flex-wrap: wrap; justify-content: center; max-width: 92vw; }
  .debug button { border: 2px solid #000; border-radius: 8px; font-weight: 800; padding: 6px 10px; background: #fec90f; color: #111; cursor: pointer; }
  .debug button.flavio { background: #7fd7ff; }
  .debug button.lula { background: #ff9d7a; }
</style>
</head>
<body>
<div id="stage">
  <div class="status" id="statusText">conectando…</div>

  <div class="lb-score" id="lbScore">
    <div class="sb-row">
      <span class="sb-val flavio" id="htVsF">0%</span>
      <div class="sb-bar"><i class="seg flavio" id="sbBarF" style="width:0%"></i><i class="seg lula" id="sbBarL" style="width:0%"></i><span class="sb-mid"></span><b class="sb-num flavio" id="sbNumF"></b><b class="sb-num lula" id="sbNumL"></b></div>
      <span class="sb-val lula" id="htVsL">0%</span>
    </div>
    <div class="sb-meta" id="sbMeta">SEM LIMITE</div>
  </div>

  <div class="hud-flavio">
    <div class="hud-metric"><span class="hm-label">HP</span><span class="hm-val" id="hpval-flavio">100/100</span></div>
    <div class="bar hp"><i id="hpbar-flavio" style="width:100%"></i></div>
    <div class="hud-metric sh"><span class="hm-label">ESCUDO</span><span class="hm-val" id="shval-flavio">0/200</span></div>
    <div class="bar sh"><i id="shbar-flavio" style="width:100%"></i></div>
    <div class="hud-debates"><span class="hdl">DEBATES</span><span class="hdn flavio" id="dwval-flavio">0</span></div>
  </div>

  <div class="hud-lula">
    <div class="hud-metric"><span class="hm-label">HP</span><span class="hm-val" id="hpval-lula">100/100</span></div>
    <div class="bar hp"><i id="hpbar-lula" style="width:100%"></i></div>
    <div class="hud-metric sh"><span class="hm-label">ESCUDO</span><span class="hm-val" id="shval-lula">0/200</span></div>
    <div class="bar sh"><i id="shbar-lula" style="width:100%"></i></div>
    <div class="hud-debates"><span class="hdl">DEBATES</span><span class="hdn lula" id="dwval-lula">0</span></div>
  </div>

  <div class="gift-panel gift-panel-flavio"><div class="gift-tags" id="gifts-flavio"></div></div>
  <div class="gift-panel gift-panel-lula"><div class="gift-tags" id="gifts-lula"></div></div>

  <div class="lead-flash" id="leadFlash"></div>

  <div class="shield-fx left" id="shield-flavio"></div>
  <div class="shield-fx right" id="shield-lula"></div>

  <div class="fighter-wrap" id="wrap-flavio">
    <div class="fighter" id="fighter-flavio"><img id="img-flavio" alt=""></div>
    <div class="f-anchor f-speech" id="speech-flavio"></div>
    <div class="f-anchor f-vote" id="vote-flavio"></div>
  </div>
  <div class="fighter-wrap" id="wrap-lula">
    <div class="fighter" id="fighter-lula"><img id="img-lula" alt=""></div>
    <div class="f-anchor f-speech" id="speech-lula"></div>
    <div class="f-anchor f-vote" id="vote-lula"></div>
  </div>
  <div class="hit" id="hit"></div>
  <div id="supporterWrap" class="supporter"><img id="supporterImg" alt=""><div id="supporterBubble" class="supporter-bubble"></div></div>
  <div class="float-text" id="floatText"></div>
  <div class="win-banner" id="winBanner">
    <div class="big" id="winBig"></div>
    <div class="sub" id="winSub"></div>
  </div>

  <div class="debug" id="debug" style="display:none"></div>
  <audio id="bgMusic" preload="auto" style="display:none"></audio>
</div>

<script>
const params = new URLSearchParams(location.search);
const DEBUG = params.get("debug") === "1";
const token = params.get("tk") || localStorage.getItem("token");
if (!token && !DEBUG) location.href = "/login";

const FIGHTERS = {
  flavio: {
    name: "FLÁVIO", dir: 1,
    sprites: { idle: "/duelo/Flavio/neutro.png", defense: "/duelo/Flavio/defesa.png", punch: "/duelo/Flavio/soco.png", kick: "/duelo/Flavio/chute.png", uppercut: "/duelo/Flavio/levantada.png", victory: "/duelo/Flavio/vitoria.png", esperando: "/duelo/Flavio/esperando.png" },
  },
  lula: {
    name: "LULA", dir: -1,
    sprites: { idle: "/duelo/lula/neutro.png", defense: "/duelo/lula/defesa.png", punch: "/duelo/lula/soco.png", kick: "/duelo/lula/chute.png", uppercut: "/duelo/lula/levantada.png", victory: "/duelo/lula/vitoria.png", esperando: "/duelo/lula/esperando.png" },
  },
};

const ACTION_DUR = { punch: { fwd: 300, hold: 120, back: 130 }, kick: { fwd: 380, hold: 160, back: 160 }, uppercut: { fwd: 420, hold: 200, back: 180 } };
const MAX_ATTACK_QUEUE = 20;

let state = { mode: "hp", hp: { flavio: 0, lula: 0 }, shield: { flavio: 0, lula: 0 }, votes: { flavio: 0, lula: 0 }, hp_max: 100, shield_max: 200, winner: null, roundActive: true, final: false, active: false };
let attackQueue = [];

const DUELO_LAYOUT_DEFAULT = {
  score: { x: 50, y: 5, scale: 1 },
  flavioHud: { x: 2, y: 14, scale: 1 },
  lulaHud: { x: 98, y: 14, scale: 1 },
  flavioGifts: { x: 2, y: 32, scale: 1 },
  lulaGifts: { x: 98, y: 32, scale: 1 },
  fighters: { y: 20, scale: 0.9, gap: 9 },
};
let dueloLayout = {};

function clampN(v, lo, hi, fb) { const n = Number(v); return Number.isFinite(n) ? Math.max(lo, Math.min(hi, n)) : fb; }

function normalizeLayout(raw) {
  const d = JSON.parse(JSON.stringify(DUELO_LAYOUT_DEFAULT));
  if (raw && typeof raw === "object") {
    for (const k of Object.keys(d)) {
      if (raw[k] && typeof raw[k] === "object") d[k] = Object.assign({}, d[k], raw[k]);
    }
  }
  return d;
}

function applyLayout() {
  const L = dueloLayout || {};
  const e = (k) => (L[k] && typeof L[k] === "object") ? L[k] : {};
  const st = $("stage");
  if (!st) return;
  const score = e("score"), fh = e("flavioHud"), lh = e("lulaHud"), fg = e("flavioGifts"), lg = e("lulaGifts"), fi = e("fighters");
  st.style.setProperty("--score-x", clampN(score.x, 0, 100, 50));
  st.style.setProperty("--score-y", clampN(score.y, 0, 100, 5));
  st.style.setProperty("--score-scale", clampN(score.scale, 0.2, 2, 1));
  st.style.setProperty("--fh-x", clampN(fh.x, 0, 100, 2));
  st.style.setProperty("--fh-y", clampN(fh.y, 0, 100, 14));
  st.style.setProperty("--fh-scale", clampN(fh.scale, 0.2, 2, 1));
  st.style.setProperty("--lh-x", clampN(lh.x, 0, 100, 98));
  st.style.setProperty("--lh-y", clampN(lh.y, 0, 100, 14));
  st.style.setProperty("--lh-scale", clampN(lh.scale, 0.2, 2, 1));
  st.style.setProperty("--fg-x", clampN(fg.x, 0, 100, 2));
  st.style.setProperty("--fg-y", clampN(fg.y, 0, 100, 32));
  st.style.setProperty("--fg-scale", clampN(fg.scale, 0.2, 2, 1));
  st.style.setProperty("--lg-x", clampN(lg.x, 0, 100, 98));
  st.style.setProperty("--lg-y", clampN(lg.y, 0, 100, 32));
  st.style.setProperty("--lg-scale", clampN(lg.scale, 0.2, 2, 1));
  st.style.setProperty("--fire-y", clampN(fi.y, 0, 100, 20));
  st.style.setProperty("--fire-scale", clampN(fi.scale, 0.2, 2, 0.9));
  st.style.setProperty("--fire-gap", clampN(fi.gap, 0, 30, 9) + "vh");
}

// ---- Sem interação (idle) ----
const DUELO_IDLE_DEFAULT = { enabled: true, enterAfter: 10, interval: 7 };
let idleCfg = Object.assign({}, DUELO_IDLE_DEFAULT);
let idleActive = false;
let idleEnterTimer = null;
let idleSpeechTimer = null;
let idleSpeechShowTimer = null;
let idleSpeakingChar = null;
let idleLastPhrase = "";
let idleLastChar = null;
let idleSpeechCd = 0;

const IDLE_BALLOONS = [
  "/duelo/falas-sem-interacao/bora-interagir.png",
  "/duelo/falas-sem-interacao/cade-o-apoio.png",
  "/duelo/falas-sem-interacao/manda-presente.png",
  "/duelo/falas-sem-interacao/quem-leva-essa.png",
  "/duelo/falas-sem-interacao/to-esperando.png",
  "/duelo/falas-sem-interacao/vamos-de-debate.png",
];

function applyIdleConfig(idle) {
  if (!idle) idle = {};
  idleCfg = {
    enabled: idle.enabled !== false,
    enterAfter: clampN(idle.enter_after != null ? idle.enter_after : idle.enterAfter, 3, 120, 10),
    interval: clampN(idle.interval, 3, 60, 7),
  };
  if (!idleCfg.enabled) exitIdleState();
  else scheduleIdleEnter();
}

function clearIdleBalloon() {
  if (idleSpeakingChar) {
    const el = $("speech-" + idleSpeakingChar);
    if (el) el.classList.remove("show");
    idleSpeakingChar = null;
  }
  if (idleSpeechShowTimer) { clearTimeout(idleSpeechShowTimer); idleSpeechShowTimer = null; }
}

function exitIdleState() {
  clearIdleBalloon();
  if (idleEnterTimer) { clearTimeout(idleEnterTimer); idleEnterTimer = null; }
  if (idleSpeechTimer) { clearTimeout(idleSpeechTimer); idleSpeechTimer = null; }
  if (!idleActive) return;
  idleActive = false;
  for (const f of ["flavio", "lula"]) {
    const el = $("fighter-" + f);
    if (el) el.classList.remove("idleState");
    resetPose(f);
  }
}

function enterIdleState() {
  if (idleActive || !idleCfg.enabled || supportActive) return;
  if (!state.active || state.winner || !state.roundActive || state.final) return;
  idleActive = true;
  for (const f of ["flavio", "lula"]) {
    setFighter(f, "esperando");
    const el = $("fighter-" + f);
    if (el) { el.classList.add("idleState"); el.style.transform = "translate(0,0) scale(1)"; }
  }
  scheduleIdleSpeech(2000);
}

function scheduleIdleEnter() {
  if (idleEnterTimer) { clearTimeout(idleEnterTimer); idleEnterTimer = null; }
  if (!idleCfg.enabled || idleActive || supportActive) return;
  if (!state.active || state.winner || !state.roundActive || state.final) return;
  idleEnterTimer = setTimeout(() => { idleEnterTimer = null; enterIdleState(); }, idleCfg.enterAfter * 1000);
}

function markInteraction() {
  if (idleActive) exitIdleState();
  else { clearIdleBalloon(); if (idleSpeechTimer) { clearTimeout(idleSpeechTimer); idleSpeechTimer = null; } }
  scheduleIdleEnter();
}

function scheduleIdleSpeech(delayMs) {
  if (idleSpeechTimer) { clearTimeout(idleSpeechTimer); idleSpeechTimer = null; }
  idleSpeechTimer = setTimeout(() => { idleSpeechTimer = null; if (idleActive && !state.winner) showIdleSpeech(); }, delayMs);
}

function showIdleSpeech() {
  if (!idleActive || state.winner || idleSpeakingChar) return;
  const now = Date.now();
  if (now < idleSpeechCd) { scheduleIdleSpeech(idleSpeechCd - now + 50); return; }
  const char = idleLastChar === "flavio" ? "lula" : "flavio";
  const pool = IDLE_BALLOONS.filter((b) => b !== idleLastPhrase);
  const url = pool.length ? pool[Math.floor(Math.random() * pool.length)] : IDLE_BALLOONS[0];
  idleLastPhrase = url;
  idleLastChar = char;
  idleSpeakingChar = char;
  idleSpeechCd = now + idleCfg.interval * 1000;
  const el = $("speech-" + char);
  if (el) {
    el.innerHTML = '<img class="speech-img" src="' + url + '" alt="">';
    el.classList.remove("show");
    void el.offsetWidth;
    el.classList.add("show");
  }
  idleSpeechShowTimer = setTimeout(() => {
    const e2 = $("speech-" + char);
    if (e2) e2.classList.remove("show");
    if (idleSpeakingChar === char) idleSpeakingChar = null;
    idleSpeechShowTimer = null;
    if (idleActive && !state.winner) scheduleIdleSpeech(1500);
  }, 3000);
}

// ---- Áudio: efeitos + música de fundo ----
let sfxVolume = 0.92;
let musicCfg = { files: [], volume: 0.5, enabled: false, base: "" };
let musicPlaying = false;
let musicIdx = 0;

function applyScene(sc) {
  const st = $("stage");
  if (st) st.style.setProperty("--scene-bg", "url('/duelo/" + sceneName(sc) + ".png')");
}

function sceneName(sc) {
  return /^(brasilia|sao-paulo|rio-de-janeiro|salvador)$/.test(String(sc)) ? String(sc) : "brasilia";
}

function applyAudioSettings(settings) {
  if (!settings) return;
  if (settings.sfx_volume != null) {
    sfxVolume = Math.max(0, Math.min(100, Number(settings.sfx_volume) || 0)) / 100;
  }
  if (settings.music) {
    musicCfg = {
      files: Array.isArray(settings.music.files) ? settings.music.files : [],
      volume: Math.max(0, Math.min(100, Number(settings.music.volume) || 0)) / 100,
      enabled: !!settings.music.enabled,
      base: settings.music.base || "",
    };
  }
  refreshMusic();
}

function stopMusic() {
  const el = $("bgMusic");
  if (el) { el.pause(); el.onended = null; el.removeAttribute("src"); }
  musicPlaying = false;
}

function playMusicTrack(i) {
  const files = musicCfg.files;
  const el = $("bgMusic");
  if (!files.length || !el) return;
  const idx = ((i % files.length) + files.length) % files.length;
  musicIdx = idx;
  el.src = musicCfg.base + "/" + files[idx];
  el.volume = musicCfg.volume;
  el.loop = false;
  el.onended = () => { musicIdx = idx + 1; refreshMusic(); };
  const p = el.play();
  if (p && p.then) {
    p.catch((err) => { try { console.debug("[DUELO MUSIC] autoplay bloqueado (tocará no 1º toque):", (err && err.name) || err); } catch (e) {} });
  }
  musicPlaying = true;
}

function refreshMusic() {
  if (!musicCfg.enabled || !musicCfg.files.length) { stopMusic(); return; }
  const el = $("bgMusic");
  if (el && musicPlaying) { el.volume = musicCfg.volume; return; }
  if (el) el.volume = musicCfg.volume;
  playMusicTrack(musicIdx);
}

const GIFT_ACTION_LABEL = { punch: "Soco", kick: "Chute", uppercut: "Levantada" };
const GIFT_SUPPORT_TYPES = ["apoio", "support", "vote"];

function fmtNum(n) { return Number(n || 0).toLocaleString("pt-BR"); }

function renderGiftTags() {
  for (const f of ["flavio", "lula"]) {
    const el = $("gifts-" + f);
    if (!el) continue;
    const list = dueloGifts.filter((g) => g && g.active !== false && (g.character || f) === f);
    const tags = list.map((g) => {
      const span = document.createElement("span");
      const tg = String(g.type || "").toLowerCase();
      const isSup = GIFT_SUPPORT_TYPES.includes(tg);
      const isEsc = tg === "escudo";
      span.className = "gift-tag";
      if (g.image) {
        const img = document.createElement("img");
        img.src = g.image;
        img.alt = "";
        img.onerror = function () { this.style.display = "none"; };
        span.appendChild(img);
      } else {
        const ic = document.createElement("span");
        ic.className = "gift-icon";
        ic.textContent = isSup ? "💗" : isEsc ? "🛡" : "🎁";
        span.appendChild(ic);
      }
      const eff = document.createElement("span");
      eff.className = "gift-effect";
      if (isSup) eff.textContent = "APOIO";
      else if (isEsc) eff.textContent = "ESCUDO +" + (Number(g.shield) > 0 ? g.shield : 15);
      else eff.textContent = (GIFT_ACTION_LABEL[g.action] || "GOLPE").toUpperCase();
      span.appendChild(eff);
      return span;
    });
    for (const k of Object.keys(SUP_LABELS)) {
      const c = supCfg[k];
      if (!c || c.enabled === false || !c.gift_name || (c.side || (SUPPORTERS[k] && SUPPORTERS[k].side)) !== f) continue;
      const ts = document.createElement("span");
      ts.className = "gift-tag";
      if (c.image) {
        const img = document.createElement("img");
        img.src = c.image;
        img.alt = "";
        img.onerror = function () { this.style.display = "none"; };
        ts.appendChild(img);
      } else {
        const ic = document.createElement("span");
        ic.className = "gift-icon";
        ic.textContent = "🎁";
        ts.appendChild(ic);
      }
      const e2 = document.createElement("span");
      e2.className = "gift-effect";
      e2.textContent = SUP_LABELS[k];
      ts.appendChild(e2);
      tags.push(ts);
    }
    el.replaceChildren(...tags);
  }
}

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const opponent = (f) => (f === "flavio" ? "lula" : "flavio");

function setFighter(fighter, stateName) {
  const img = $("img-" + fighter);
  const url = FIGHTERS[fighter].sprites[stateName] || FIGHTERS[fighter].sprites.idle;
  if (img) {
    img.onerror = function () { if (this.src.indexOf("vitoria") !== -1) this.src = FIGHTERS[fighter].sprites.idle; };
    img.src = url;
  }
  const el = $("fighter-" + fighter);
  if (el) el.dataset.state = stateName;
}

function resetPose(fighter) {
  const el = $("fighter-" + fighter);
  setFighter(fighter, "idle");
  const wr = $("wrap-" + fighter);
  if (wr) { wr.classList.remove("attacking"); wr.classList.remove("fronting"); }
  if (el) { el.classList.remove("attacking"); el.classList.remove("winner"); el.classList.remove("down"); el.classList.remove("victory-enter"); el.style.transition = "transform .28s ease"; el.style.transform = "translate(0,0) scale(1)"; }
}

function pctBar(v, max) { return Math.max(0, Math.min(100, (v / (max || 1)) * 100)); }

function renderHud() {
  const hpMax = state.hp_max || 100;
  const shMax = state.shield_max || 200;
  for (const f of ["flavio", "lula"]) {
    const hpEl = $("hpbar-" + f);
    if (hpEl) hpEl.style.width = pctBar(state.hp[f], hpMax) + "%";
    const shEl = $("shbar-" + f);
    if (shEl) shEl.style.width = pctBar(state.shield[f], shMax) + "%";
    const hpL = $("hpval-" + f);
    if (hpL) hpL.textContent = (state.hp[f] || 0) + "/" + hpMax;
    const shL = $("shval-" + f);
    if (shL) shL.textContent = (state.shield[f] || 0) + "/" + shMax;
    const dw = $("dwval-" + f);
    if (dw) dw.textContent = (state.debate_wins && state.debate_wins[f]) || 0;
    const vr = $("votes-" + f);
    if (vr) {
      if (state.mode === "votes") vr.textContent = state.votes[f] + (state.votes[f] === 1 ? " VOTO" : " VOTOS");
      else vr.textContent = "";
    }
  }
  const vsF = $("htVsF");
  const vsL = $("htVsL");
  const meta = $("sbMeta");
  const barF = $("sbBarF");
  const barL = $("sbBarL");
  const barBox = $("sbBar");
  const nF = $("sbNumF");
  const nL = $("sbNumL");
  const vt = state.vote_target || 0;
  const fv = state.votes.flavio || 0, lv = state.votes.lula || 0;
  if (vt > 0) {
    const majority = Math.floor(vt / 2) + 1;
    const fp = Math.max(0, Math.min(100, (fv / vt) * 100));
    const lp = Math.max(0, Math.min(100, (lv / vt) * 100));
    if (vsF) vsF.textContent = Math.round(fp) + "%";
    if (vsL) vsL.textContent = Math.round(lp) + "%";
    if (meta) meta.textContent = "VENCE COM " + fmtNum(majority);
    if (barBox) barBox.style.display = "";
    if (barF) barF.style.width = fp + "%";
    if (barL) barL.style.width = lp + "%";
    if (nF) { nF.textContent = fmtNum(fv); nF.style.display = ""; }
    if (nL) { nL.textContent = fmtNum(lv); nL.style.display = ""; }
  } else {
    if (vsF) vsF.textContent = fmtNum(fv);
    if (vsL) vsL.textContent = fmtNum(lv);
    if (meta) meta.textContent = "SEM LIMITE";
    if (barBox) barBox.style.display = "none";
    if (nF) nF.style.display = "none";
    if (nL) nL.style.display = "none";
  }
}

function clearWinnerVisual() {
  const banner = $("winBanner");
  if (banner) banner.classList.remove("show");
  for (const f of ["flavio", "lula"]) {
    const el = $("fighter-" + f);
    if (el) { el.classList.remove("winner"); el.classList.remove("down"); el.classList.remove("victory-enter"); }
    const wr = $("wrap-" + f);
    if (wr) wr.classList.remove("fronting");
  }
}

function renderWinner() {
  if (!state.winner) { lastWinner = null; clearWinnerVisual(); return; }
  if (lastWinner !== state.winner) { lastWinner = state.winner; say(state.winner, "victory"); }
  const winner = state.winner;
  const loser = opponent(winner);
  // Pose PERSISTENTE: vencedor em victory e perdedor "down" enquanto state.winner preenchido.
  setFighter(winner, "victory");
  setFighter(loser, "idle");
  const wEl = $("fighter-" + winner);
  const lEl = $("fighter-" + loser);
  const wWrap = $("wrap-" + winner);
  if (wWrap) wWrap.classList.add("fronting");
  if (wEl) {
    wEl.classList.remove("attacking");
    wEl.style.transform = "translate(0,0) scale(1)";
    wEl.classList.add("winner");
    if (!wEl.classList.contains("victory-enter")) {
      wEl.classList.add("victory-enter");
      setTimeout(() => { const el = $("fighter-" + winner); if (el) el.classList.remove("victory-enter"); }, 750);
    }
  }
  if (lEl) {
    lEl.classList.remove("attacking");
    lEl.style.transform = "translate(0,0) scale(1)";
    lEl.classList.add("down");
  }

  const banner = $("winBanner");
  if (banner) {
    // Vitória de DEBATE (KO) usa o banner específico; FINAL usa o "-ganhou".
    const debate = winner === "lula" ? "lula-ganhou-debate-v3" : winner + "-ganhou-o-debate";
    const base = state.final ? winner + "-ganhou" : debate;
    const fb = "/duelo/banners/" + winner + "-ganhou.png?v=3";
    banner.innerHTML = '<img class="banner-img" src="/duelo/banners/' + base + '.png?v=3" onerror="this.onerror=null;this.src=\'' + fb + '\'">';
    banner.classList.add("show");
  }
}

function applyState(s) {
  if (!s) return;
  const prevInactive = !state.roundActive || !!state.winner;
  const prevHp = { flavio: state.hp && state.hp.flavio, lula: state.hp && state.hp.lula };
  state = Object.assign({}, state, s);
  const idleOk = state.active && state.roundActive && !state.winner && !state.final;
  if (idleOk) scheduleIdleEnter();
  else exitIdleState();
  renderHud();
  if (state.winner) {
    pendingWinnerVisual = { winner: state.winner, final: state.final };
    attackQueue = [];
    if (!busy) flushWinnerVisual();
  } else {
    renderWinner();
  }
  if (s.votes && (s.votes.flavio || 0) === 0 && (s.votes.lula || 0) === 0) lastLead = null;
  if (!state.winner) {
    for (const f of ["flavio", "lula"]) {
      const pv = prevHp[f];
      const nv = state.hp[f];
      if (pv && nv != null && pv > 30 && nv <= 30) say(f, "lowHp");
    }
  }
  const roundReset = !s.winner && s.roundActive && prevInactive;
  if (roundReset) {
    attackQueue = [];
    busy = false;
    currentCombo = 0;
    resetPose("flavio");
    resetPose("lula");
    $("combo") && clearCombo();
    $("htVs") && renderHud();
  }
  try { console.debug("[DUELO STATE]", { mode: state.mode, hp: state.hp, hp_max: state.hp_max, shield: state.shield, shield_max: state.shield_max, winner: state.winner, roundActive: state.roundActive, final: state.final }); } catch (e) {}
}

function flushWinnerVisual() {
  if (pendingWinnerVisual && state.winner) {
    pendingWinnerVisual = null;
    renderWinner();
  }
}

function updateCombo() {
  if (state.winner) return;
  const c = $("combo");
  if (!c) return;
  if (currentCombo > 1) { c.textContent = "x" + currentCombo; c.classList.add("show"); }
  else { c.textContent = ""; c.classList.remove("show"); }
}
function clearCombo() { const c = $("combo"); if (c) { c.textContent = ""; c.classList.remove("show"); } }

function spawnHit(type, dir) {
  const hit = $("hit");
  if (!hit) return;
  hit.style.left = (dir > 0 ? 56 : 44) + "%";
  hit.className = "hit " + (type === "uppercut" ? "uppercut" : type) + " show";
  setTimeout(() => { hit.className = "hit"; hit.style.left = "50%"; }, 380);
}

let audioUnlocked = false;
let pendingAudio = [];
let audioEls = {};

function tryPlay(url) {
  try {
    let a = audioEls[url];
    if (!a) {
      a = new Audio(url);
      a.preload = "auto";
      a.load();
      audioEls[url] = a;
    }
    a.volume = sfxVolume;
    a.currentTime = 0;
    const p = a.play();
    if (p && p.then) {
      p.catch((err) => {
        try {
          if (!audioUnlocked) {
            const st = $("statusText");
            if (st) st.textContent = "toque na tela para liberar o som";
          }
          console.debug("[DUELO AUDIO] bloqueado por autoplay:", (err && err.name) || err);
        } catch (e) {}
      });
    }
  } catch (e) { try { console.debug("[DUELO AUDIO] erro:", e); } catch (_) {} }
}

function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) { const ctx = new AC(); if (ctx.resume) ctx.resume(); }
  } catch (e) {}
  const urls = pendingAudio.splice(0, pendingAudio.length);
  for (const u of urls) tryPlay(u);
  refreshMusic();
}

function playAudio(url) {
  if (!url) { try { console.debug("[DUELO AUDIO] audio_url vazio (golpe sem áudio anexado?)"); } catch (e) {} return; }
  if (audioUnlocked) { tryPlay(url); return; }
  pendingAudio.push(url);
  tryPlay(url);
}

document.addEventListener("pointerdown", unlockAudio, { once: true });
document.addEventListener("keydown", unlockAudio, { once: true });
document.addEventListener("touchstart", unlockAudio, { once: true });

  },
};
const speechTimer = {};
const speechCd = { flavio: 0, lula: 0 };
let lastPhrase = "";

function say(fighter, bucket) {
  const list = (SPEECH[fighter] && SPEECH[fighter][bucket]) || [];
  if (!list.length || state.winner || supportActive) return;
  clearIdleBalloon();
  const now = Date.now();
  if (now < speechCd[fighter]) return;
  const opts = list.filter((p) => p !== lastPhrase);
  const phrase = opts[Math.floor(Math.random() * opts.length)];
  lastPhrase = phrase;
  speechCd[fighter] = now + 4000;
  const el = $("speech-" + fighter);
  if (!el) return;
  el.innerHTML = '<img class="speech-img" src="' + phrase + '" alt="">';
  el.classList.remove("show");
  void el.offsetWidth;
  el.classList.add("show");
  clearTimeout(speechTimer[fighter]);
  speechTimer[fighter] = setTimeout(() => el.classList.remove("show"), 1800);
}

// ---- Feedback de votos / virada ----
function voteFloat(char, txt, cls) {
  const host = $("vote-" + char);
  if (!host) return;
  const s = document.createElement("div");
  s.className = "vote-float " + char + (cls ? " " + cls : "");
  s.textContent = txt;
  s.style.marginLeft = (Math.random() * 22 - 11) + "px";
  s.style.marginTop = (Math.random() * 16 - 8) + "px";
  host.appendChild(s);
  setTimeout(() => s.remove(), 1600);
}

function damageFloat(fighter, hpDmg, absorbed) {
  const host = $("vote-" + fighter);
  if (!host) return;
  if (absorbed > 0) {
    const sh = document.createElement("div");
    sh.className = "vote-float " + fighter + " sh";
    sh.textContent = "-" + absorbed + " ESCUDO";
    sh.style.marginLeft = (Math.random() * 22 - 11) + "px";
    host.appendChild(sh);
    setTimeout(() => sh.remove(), 1500);
  }
  if (hpDmg > 0) {
    const d = document.createElement("div");
    d.className = "vote-float " + fighter + " dmg";
    d.textContent = "-" + hpDmg;
    d.style.marginLeft = (Math.random() * 22 - 11) + "px";
    host.appendChild(d);
    setTimeout(() => d.remove(), 1500);
  }
}

function comboLabel(combo) {
  if (combo >= 100) return "MEGA COMBO!";
  if (combo >= 50) return "SUPER COMBO!";
  return "COMBO x" + combo + "!";
}

function spawnCombo(char, combo) {
  if (!combo || combo < 2) return;
  voteFloat(char, comboLabel(combo), "combo");
}

// ---- Apoios Especiais ----
const SUPPORTERS = {
  nikolas: {
    side: "flavio",
    sprites: { punch: "/duelo/nikolas/soco.png", kick: "/duelo/nikolas/chute.png", uppercut: "/duelo/nikolas/levantada.png" },
    falas: ["a-verdade-sempre-venceu", "anota-ai", "bora-pra-cima", "brasil-acima-de-tudo", "chega-de-narrativa", "ja-deu-dessa-palhacaca", "nunca-subestime-um-pia", "o-sistema-treme", "vamo-virar-esse-jogo"].map((n) => `/duelo/nikolas/falas/${n}.png`),
  },
  "lucas-pavanato": {
    side: "flavio",
    sprites: { punch: "/duelo/lucas-pavanato/soco.png", kick: "/duelo/lucas-pavanato/chute.png", uppercut: "/duelo/lucas-pavanato/levantada.png" },
    falas: ["aqui-nao-tem-medo", "cheguei-na-area", "e-pelo-brasil", "juventude-na-luta", "nao-vou-recuar", "pra-frente-sempre", "vamos-pra-cima"].map((n) => `/duelo/lucas-pavanato/falas/${n}.png`),
  },
  "ana-elisa": {
    side: "lula",
    sprites: { punch: "/duelo/ana-elisa/soco.png", kick: "/duelo/ana-elisa/chute.png", uppercut: "/duelo/ana-elisa/levantada.png" },
    falas: ["a-politica-tambem-e-nossa", "agora-e-a-juventude", "cheguei-pra-somar", "direitos-educacao-futuro", "juventude-faz-diferenca", "sem-recuar", "to-naarea"].map((n) => `/duelo/ana-elisa/falas/${n}.png`),
  },
  "erika-hilton": {
    side: "lula",
    sprites: { punch: "/duelo/erika-hilton/soco.png", kick: "/duelo/erika-hilton/chute.png", uppercut: "/duelo/erika-hilton/levantada.png" },
    falas: ["a-gente-existe-e-resiste", "direitos-sao-ara-todos", "hoje-nao", "jamais-tolerarei", "nao-vou-recuar", "respeito-sempre", "vai-aceitar-ou-passar-mal"].map((n) => `/duelo/erika-hilton/falas/${n}.png`),
  },
};
const SUP_LABELS = { nikolas: "NIKOLAS", "lucas-pavanato": "PAVANATO", "ana-elisa": "ANA ELISA", "erika-hilton": "ERIKA" };
let supCfg = {};
function applySupporterConfig(s) {
  supCfg = {};
  if (s && typeof s === "object") {
    for (const k of Object.keys(SUP_LABELS)) {
      const v = s[k];
      if (v && typeof v === "object") supCfg[k] = { enabled: v.enabled !== false, gift_name: String(v.gift_name || ""), damage: Number(v.damage) || 0, side: v.side, image: String(v.image || "") };
    }
  }
  renderGiftTags();
}
const SUPPORT_ACTIONS = ["punch", "kick", "uppercut"];
let supportQueue = [];
let supportActive = false;
const SUPPORT_MAX_Q = 10;
const lastSupFala = {};

function pickSupFala(sup) {
  const arr = Array.isArray(sup.falas) ? sup.falas : [];
  if (!arr.length) return "";
  const key = sup.side || "x";
  const pool = arr.length > 1 ? arr.filter((f) => f !== lastSupFala[key]) : arr;
  const pick = pool[Math.floor(Math.random() * pool.length)] || arr[0];
  lastSupFala[key] = pick;
  return pick;
}

function preloadSupporterAssets() {
  const srcs = [];
  Object.values(SUPPORTERS).forEach((s) => {
    Object.values(s.sprites || {}).forEach((u) => srcs.push(u));
    (s.falas || []).forEach((u) => srcs.push(u));
  });
  srcs.forEach((u) => { const im = new Image(); im.src = u; });
}

function enqueueSupport(item) {
  if (!item || !SUPPORTERS[item.supporter]) return;
  if (state.winner || !state.roundActive || state.final) return;
  supportQueue.push(item);
  if (supportQueue.length > SUPPORT_MAX_Q) supportQueue.shift();
  pump();
}

async function runSupport(item) {
  const sup = SUPPORTERS[item.supporter];
  supportActive = true;
  const side = item.side || sup.side;
  const wrap = $("supporterWrap");
  const img = $("supporterImg");
  const bubble = $("supporterBubble");
  if (!wrap || !img) return;
  const retreat = side === "flavio" ? -1 : 1;
  const mEl = $("fighter-" + side);
  if (mEl) { mEl.style.transition = "transform .3s ease"; mEl.style.transform = `translateX(${retreat * 70}px)`; }
  wrap.className = "supporter side-" + side;
  img.style.opacity = "1";
  img.onerror = function () { img.style.opacity = 0.5; };
  const acts = SUPPORT_ACTIONS.filter((a) => sup.sprites[a]);
  const action = acts.length ? acts[Math.floor(Math.random() * acts.length)] : "punch";
  img.src = sup.sprites[action] || "";
  try { await Promise.race([img.decode(), sleep(600)]); } catch (e) { img.style.opacity = 0.5; }
  void wrap.offsetWidth;
  wrap.classList.add("enter");
  try { console.debug("[SUPPORT]", item.supporter, side, action, img.src, "w=" + img.naturalWidth, "display=" + getComputedStyle(wrap).display); } catch (e) {}
  const fala = pickSupFala(sup);
  if (fala && bubble) bubble.innerHTML = '<img src="' + fala + '" alt="">';
  if (item.audio_url) playAudio(item.audio_url);
  await sleep(400);
  await sleep(520);
  spawnHit(action, side === "flavio" ? 1 : -1);
  if (item.added_votes > 0) {
    voteFloat(side, "+" + item.added_votes + " VOTOS");
    const ap = $("lbScore");
    if (ap) { ap.classList.remove("pulse"); void ap.offsetWidth; ap.classList.add("pulse"); }
  }
  await sleep(800);
  if (bubble) bubble.innerHTML = "";
  wrap.classList.remove("enter");
  wrap.classList.add("exit");
  await sleep(350);
  wrap.className = "supporter";
  img.style.opacity = "";
  if (!state.winner) resetPose(side);
}

let pendingWinnerVisual = null;

function pump() {
  if (busy) return;
  if (supportQueue.length) {
    const item = supportQueue.shift();
    busy = true;
    runSupport(item).catch(() => {}).finally(() => { supportActive = false; busy = false; flushWinnerVisual(); pump(); });
  } else {
    processQueue();
  }
}

function showFlash(name) {
  const el = $("leadFlash");
  if (!el) return;
  el.innerHTML = '<img class="banner-img" src="/duelo/banners/' + name + '.png?v=2" alt="">';
  el.classList.remove("show");
  void el.offsetWidth;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2400);
}

function leadOf(votes) {
  const f = (votes && votes.flavio) || 0;
  const l = (votes && votes.lula) || 0;
  return f === l ? 0 : (f > l ? 1 : -1);
}

let lastLead = null;
function trackLeadChange(votes) {
  const lead = leadOf(votes);
  if (lastLead !== null && lastLead !== lead) {
    if (lead === 0) showFlash("empate");
    else {
      const c = lead === 1 ? "flavio" : "lula";
      showFlash(c + "-virou");
      say(c, "leadChange");
    }
  }
  lastLead = lead;
}

let lastWinner = null;

function shieldEffect(fighter, points) {
  const fx = $("shield-" + fighter);
  if (fx) { fx.classList.remove("show"); void fx.offsetWidth; fx.classList.add("show"); setTimeout(() => fx.classList.remove("show"), 850); }
  voteFloat(fighter, "+" + points + " ESCUDO", "sh");
}

function enqueueAttack(att) {
  if (!att || !FIGHTERS[att.attacker]) return;
  // Presentes reais: bloqueados durante banner/final. Testes (isTest) passam sempre.
  if (!att.isTest && (!state.roundActive || state.winner)) return;
  attackQueue.push(att);
  if (attackQueue.length > MAX_ATTACK_QUEUE) attackQueue.shift();
  pump();
}

async function processQueue() {
  if (busy || !attackQueue.length) return;
  if (!state.roundActive || state.winner) {
    // Parado: mantém a fila só se houver testes visuais; senão descarta reais.
    if (!attackQueue.some((a) => a.isTest)) { attackQueue = []; return; }
  }
  busy = true;
  const att = attackQueue.shift();
  try { await runAttack(att); } catch (e) {}
  if (!state.roundActive && !att.isTest) { attackQueue = []; }
  if (!state.winner) {
    resetPose("flavio");
    resetPose("lula");
  }
  if (!att.isTest) updateCombo();
  setTimeout(() => { busy = false; flushWinnerVisual(); pump(); }, 150);
}

async function runAttack(att) {
  const a = FIGHTERS[att.attacker];
  const def = opponent(att.attacker);
  const dur = ACTION_DUR[att.action] || ACTION_DUR.punch;
  const dir = a.dir;
  const move = att.action === "uppercut" ? 30 : (att.action === "kick" ? 46 : 34);

  // Teste visual durante banner de vitória: esconde o banner apenas localmente.
  if (att.isTest && state.winner) {
    const banner = $("winBanner");
    if (banner) banner.classList.remove("show");
  }

  setFighter(att.attacker, att.action);
  setFighter(def, "defense");
  const atEl = $("fighter-" + att.attacker);
  const deEl = $("fighter-" + def);
  const atWrap = $("wrap-" + att.attacker);
  if (atWrap) atWrap.classList.add("attacking");
  if (atEl) {
    atEl.classList.add("attacking");
    atEl.style.transition = `transform ${dur.fwd}ms ease-out`;
    const up = att.action === "uppercut" ? " translateY(-18px)" : " translateY(0)";
    const sc = att.action === "kick" ? " scale(1.05)" : " scale(1)";
    atEl.style.transform = `translateX(${dir * move}px)${up}${sc}`;
  }
  if (deEl) { deEl.style.transition = `transform ${dur.fwd}ms ease-in`; deEl.style.transform = `translateX(${-dir * 14}px)`; }
  await sleep(dur.fwd);
  if (deEl) deEl.style.transform = `translateX(${-dir * 30}px)`;
  spawnHit(att.action, dir);
  if (att.combo > 0) { currentCombo = att.combo; updateCombo(); }
  spawnCombo(att.attacker, att.combo || 1);
  playAudio(att.audio_url);
  await sleep(dur.hold);
  if (!state.winner) resetPose(att.attacker);
  if (!state.winner) resetPose(def);
  await sleep(dur.back);
}

// ---- WebSocket ----
function connectWS() {
  if (!token) return;
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/browser?token=${encodeURIComponent(token)}`);
  ws.onopen = () => { $("statusText").textContent = "conectado"; };
  ws.onclose = (e) => {
    if (e && e.code === 1008) { $("statusText").textContent = "sessão inválida — redirecionando…"; location.href = "/login"; return; }
    $("statusText").textContent = "desconectado — reconectando…";
    setTimeout(connectWS, 3000);
  };
  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.type === "duelo_state") applyState(msg);
    else if (msg.type === "duelo_attack") {
      markInteraction();
      enqueueAttack({ attacker: msg.attacker, action: msg.action, combo: msg.combo || 1, audio_url: msg.audio_url || "", isTest: !!msg.isTest });
      damageFloat(opponent(msg.attacker), msg.hp_damage || 0, msg.absorbed || 0);
      say(msg.attacker, msg.action || "punch");
      setTimeout(() => say(opponent(msg.attacker), "hit"), 260);
    }
    else if (msg.type === "duelo_shield") { markInteraction(); shieldEffect(msg.fighter, msg.points || 0); playAudio(msg.audio_url || ""); say(msg.fighter, "shield"); }
    else if (msg.type === "duelo_vote") {
      markInteraction();
      if (msg.added > 0) {
        voteFloat(msg.character, "+" + msg.added + " VOTOS");
        const ap = $("lbScore");
        if (ap) { ap.classList.remove("pulse"); void ap.offsetWidth; ap.classList.add("pulse"); }
      }
      trackLeadChange(msg.votes || {});
    }
    else if (msg.type === "duelo_gifts") { dueloGifts = Array.isArray(msg.gifts) ? msg.gifts : []; renderGiftTags(); }
    else if (msg.type === "duelo_support_attack") { markInteraction(); damageFloat(msg.target, msg.hp_damage || 0, msg.absorbed || 0); enqueueSupport(msg); }
    else if (msg.type === "duelo_layout") { dueloLayout = normalizeLayout(msg.layout); applyLayout(); }
    else if (msg.type === "duelo_settings") { applyAudioSettings(msg.settings); applyIdleConfig(msg.settings && msg.settings.idle); applyScene(msg.settings && msg.settings.scene); if (msg.settings && msg.settings.supporters) applySupporterConfig(msg.settings.supporters); }
  };
}

async function loadInitialState() {
  try {
    const res = await fetch("/api/duelo/state", { headers: { Authorization: "Bearer " + token } });
    const data = await res.json();
    if (data && data.success && data.settings) {
      const s = data.settings;
      state.active = !!data.active;
      if (s.layout) { dueloLayout = normalizeLayout(s.layout); applyLayout(); }
      state.mode = s.mode === "votes" ? "votes" : "hp";
      const hpStart = !isNaN(Number(s.hp_start)) ? Number(s.hp_start) : 100;
      const shStart = !isNaN(Number(s.shield_start)) ? Number(s.shield_start) : 0;
      state.hp_max = !isNaN(Number(s.hp_max)) ? Number(s.hp_max) : 100;
      state.shield_max = !isNaN(Number(s.shield_max)) ? Number(s.shield_max) : hpStart;
      state.hp = { flavio: hpStart, lula: hpStart };
      state.shield = { flavio: shStart, lula: shStart };
      applyAudioSettings(s);
      applyIdleConfig(s.idle);
      applyScene(s.scene);
      if (s.supporters) applySupporterConfig(s.supporters);
      renderHud();
    }
    if (data && Array.isArray(data.gifts)) { dueloGifts = data.gifts; renderGiftTags(); }
  } catch (e) { renderHud(); }
}

// ---- Bootstrap ----
resetPose("flavio");
resetPose("lula");
applyLayout();
scheduleIdleEnter();
preloadSupporterAssets();
renderHud();
renderGiftTags();
loadInitialState();

if (DEBUG) {
  const dbg = $("debug");
  dbg.style.display = "flex";
  ["flavio", "lula"].forEach((f) => {
    [["punch", "Soco"], ["kick", "Chute"], ["uppercut", "Levantada"]].forEach(([action, label]) => {
      const b = document.createElement("button");
      b.className = f;
      b.textContent = `${FIGHTERS[f].name} ${label}`;
      b.onclick = () => enqueueAttack({ attacker: f, action, combo: 1, audio_url: "", isTest: true });
      dbg.appendChild(b);
    });
  });
}

connectWS();
