<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikPlay — Duelo 1x1</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; background: #000; overflow: hidden; }
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #101014 url('/duelo/brasilia.png') no-repeat center bottom;
    background-size: cover;
  }

  .fighter { position: absolute; bottom: clamp(60px, 8vh, 150px); width: auto; will-change: transform; z-index: 1; }
  .fighter.attacking { z-index: 12; }
  .fighter.winner { z-index: 14; filter: drop-shadow(0 0 22px rgba(255, 210, 0, 0.9)); }
  .fighter.winner img { animation: winBounce .65s ease; }
  .fighter.victory-enter { animation: victoryPop .7s ease-out; }
  .fighter.down { z-index: 1; transform-origin: bottom center; animation: knockedDown 1.1s ease forwards; }
  @keyframes winBounce { 0%, 100% { transform: scale(1.15) translateY(-14px); } 50% { transform: scale(1.24) translateY(-24px); } }
  @keyframes victoryPop { 0% { transform: scale(.8) translateY(24px); opacity: .4; } 60% { transform: scale(1.18) translateY(-20px); opacity: 1; } 100% { transform: scale(1.08) translateY(-8px); opacity: 1; } }
  @keyframes knockedDown {
    0% { transform: rotate(0deg) translateY(0); opacity: 1; filter: none; }
    100% { transform: rotate(-92deg) translateX(-6%) translateY(26%); opacity: 0.3; filter: grayscale(0.85); }
  }
  .fighter img { display: block; max-height: 32vh; width: auto; transform-origin: bottom center; }
  #fighter-flavio { left: 50%; margin-left: calc(clamp(10vh, 14vh, 17vh) * -1 - clamp(40px, 9vh, 200px)); }
  #fighter-lula  { left: 50%; margin-left: calc(clamp(10vh, 14vh, 17vh) * -1 + clamp(40px, 9vh, 200px)); }

  .hud {
    position: absolute;
    top: clamp(180px, 16vh, 290px);
    left: 50%;
    transform: translateX(-50%);
    width: min(92vw, 980px);
    z-index: 30;
    pointer-events: none;
    display: flex;
    justify-content: space-between;
    gap: clamp(14px, 3vw, 44px);
    padding: 18px 20px 16px;
    border-radius: 20px;
    background: rgba(8, 8, 14, 0.5);
    border: 2px solid rgba(255, 255, 255, 0.18);
  }
  .hud-side {
    flex: 1;
    min-width: 0;
    pointer-events: none;
  }
  .hud-side.left  { text-align: left; }
  .hud-side.right { text-align: right; }
  .hud-top {
    position: absolute;
    top: clamp(76px, 8vh, 150px);
    left: 50%;
    transform: translateX(-50%);
    font-weight: 900;
    font-size: clamp(1.3rem, 3.6vh, 2.6rem);
    letter-spacing: 4px;
    color: #ffd200;
    text-shadow: 0 0 12px rgba(255, 150, 0, 0.9), 0 0 3px #000;
    z-index: 31;
    white-space: nowrap;
  }
  .hud-top.has {
    background: rgba(8, 8, 14, 0.55);
    border: 2px solid rgba(255, 210, 0, 0.45);
    border-radius: 999px;
    padding: 6px 22px;
  }
  .hud-name { font-weight: 900; font-size: clamp(1.2rem, 3.2vh, 2.2rem); letter-spacing: 3px; color: #fff; text-shadow: 0 0 8px #000, 0 0 16px rgba(0,0,0,0.6); margin-bottom: 4px; }
  .hud-votes { font-weight: 900; font-size: clamp(1.05rem, 2.8vh, 1.8rem); color: #ffd200; text-shadow: 0 0 12px rgba(255,150,0,0.8), 0 0 3px #000; margin-bottom: 10px; }

  .bar { width: 100%; height: clamp(14px, 1.9vh, 22px); border-radius: 999px; background: rgba(0,0,0,0.55); border: 2px solid #000; overflow: hidden; margin: 8px 0; position: relative; }
  .bar > i { display: block; height: 100%; width: 100%; transition: width .3s ease; border-radius: 999px; }
  .bar > span.label-in {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    z-index: 2; font-size: clamp(0.68rem, 1.6vh, 1rem); font-weight: 800;
    color: #fff; text-shadow: 0 0 4px #000, 0 0 12px #000; letter-spacing: 2px; pointer-events: none; white-space: nowrap;
  }
  .bar.hp > i { background: linear-gradient(90deg, #c0392b, #ff6b6b); }
  .bar.sh > i { background: linear-gradient(90deg, #2471a3, #5bc0ff); }
  .bar-label { font-size: clamp(0.62rem, 1.7vw, 0.9rem); color: #cfe0ff; text-shadow: 0 0 6px #000; font-weight: 700; }
  .gift-tags { margin-top: 14px; display: flex; flex-direction: column; gap: 5px; background: rgba(0,0,0,0.28); padding: 7px 9px; border-radius: 12px; }
  .gift-head { font-weight: 900; letter-spacing: 2px; color: #ffd200; font-size: clamp(0.72rem, 1.8vh, 1rem); text-shadow: 0 0 8px #000; margin-bottom: 2px; }
  .gift-tag {
    display: inline-flex; align-items: center; gap: 8px; width: fit-content; max-width: 100%;
    font-size: clamp(0.78rem, 1.9vh, 1.05rem); font-weight: 800;
    padding: 4px 10px 4px 4px; border-radius: 13px; letter-spacing: 0.3px;
    color: #fff; text-shadow: 0 0 6px #000;
    overflow: hidden; white-space: nowrap;
  }
  .gift-tag img { width: clamp(26px, 3.6vh, 40px); height: clamp(26px, 3.6vh, 40px); object-fit: contain; border-radius: 50%; background: rgba(0,0,0,0.45); }
  .hud-side.right .gift-tag { align-self: flex-end; }
  .gift-tag.atk { background: rgba(255, 210, 0, 0.28); border: 2px solid #ffd200; color: #ffe58a; }
  .gift-tag.esc { background: rgba(91, 192, 255, 0.28); border: 2px solid #5bc0ff; color: #cfe9ff; }

  .win-banner {
    position: absolute;
    top: 38vh;
    left: 50%;
    transform: translate(-50%,-50%);
    z-index: 50;
    background: rgba(0,0,0,0.78);
    border: 4px solid #ffd200;
    border-radius: 18px;
    padding: 18px 34px;
    text-align: center;
    font-weight: 900;
    color: #fff;
    letter-spacing: 2px;
    box-shadow: 0 0 40px rgba(255,210,0,0.5);
    opacity: 0;
    transition: opacity .25s ease;
    pointer-events: none;
  }
  .win-banner.show { opacity: 1; }
  .win-banner .big { font-size: clamp(1.4rem, 5vw, 3rem); }
  .win-banner .sub { font-size: clamp(0.9rem, 2.4vw, 1.4rem); color: #ffd200; margin-top: 6px; }

  .shield-fx { position: absolute; bottom: clamp(60px, 8vh, 150px); width: 0; height: 0; pointer-events: none; opacity: 0; }
  .shield-fx.show { opacity: 1; animation: shieldBurst .8s ease-out forwards; }
  .shield-fx.left  { left: 50%; margin-left: calc(clamp(10vh, 14vh, 17vh) * -1 - clamp(40px, 9vh, 200px)); }
  .shield-fx.right { left: 50%; margin-left: calc(clamp(10vh, 14vh, 17vh) * -1 + clamp(40px, 9vh, 200px)); }
  @keyframes shieldBurst { 0% { box-shadow: 0 0 0 0 rgba(91,192,255,0.8); } 100% { box-shadow: 0 0 0 18vmax rgba(91,192,255,0); } }
  .float-text {
    position: absolute;
    bottom: 46vh;
    left: 50%;
    transform: translateX(-50%);
    font-weight: 900;
    font-size: clamp(1.1rem, 3vw, 1.8rem);
    color: #7fd7ff;
    text-shadow: 0 0 14px rgba(0,120,255,0.9);
    z-index: 45;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
  }
  .float-text.show { animation: floatUp 1s ease-out forwards; }
  @keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 10px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -40px); } }

  .combat-shake { animation: shk .25s linear; }
  @keyframes shk { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-6px,2px); } 60% { transform: translate(6px,-2px); } }

  .hit { position: absolute; bottom: 22vh; left: 50%; z-index: 20; width: 0; height: 0; opacity: 0; pointer-events: none; }
  .hit.show { opacity: 1; }
  .hit.punch { border-left: 46px solid transparent; border-right: 46px solid transparent; border-bottom: 60px solid #fff8d0; animation: hitPunch .28s ease-out forwards; }
  .hit.kick { width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle, #fff 0%, #ffd200 40%, rgba(255,180,0,0) 70%); animation: hitKick .3s ease-out forwards; }
  .hit.uppercut { width: 6px; height: 140px; background: linear-gradient(#fff, #ff8800); border-radius: 4px; box-shadow: 0 0 26px #ff8800; animation: hitUppercut .34s ease-out forwards; }
  @keyframes hitPunch { 0% { transform: translate(-50%,0) scale(.4); opacity: 1; } 100% { transform: translate(-50%,-6vh) scale(1.15); opacity: 0; } }
  @keyframes hitKick { 0% { transform: translate(-50%,0) scale(.5); opacity: 1; } 100% { transform: translate(-50%,-8vh) scale(1.5); opacity: 0; } }
  @keyframes hitUppercut { 0% { transform: translate(-50%,0); opacity: 1; } 100% { transform: translate(-50%,-14vh); opacity: 0; } }

  .status { position: absolute; top: clamp(22px, 2vh, 44px); right: 4vw; z-index: 30; font-size: 0.8rem; color: #9aa; text-shadow: 0 0 8px #000; }
  .debug { position: absolute; bottom: 2vh; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; gap: 8px; background: rgba(0,0,0,0.6); border: 2px solid #555; border-radius: 12px; padding: 8px 10px; flex-wrap: wrap; justify-content: center; max-width: 92vw; }
  .debug button { border: 2px solid #000; border-radius: 8px; font-weight: 800; padding: 6px 10px; background: #fec90f; color: #111; cursor: pointer; }
  .debug button.flavio { background: #7fd7ff; }
  .debug button.lula { background: #ff9d7a; }
</style>
</head>
<body>
<div id="stage">
  <div class="status" id="statusText">conectando…</div>
  <div class="hud-top" id="htVs"></div>

  <div class="hud">
    <div class="hud-side left">
      <div class="hud-name">FLÁVIO</div>
      <div class="hud-votes" id="votes-flavio"></div>
      <div class="bar hp"><i id="hpbar-flavio" style="width:100%"></i><span class="label-in" id="hpval-flavio">HP</span></div>
      <div class="bar sh"><i id="shbar-flavio" style="width:100%"></i><span class="label-in" id="shval-flavio">ESCUDO</span></div>
      <div class="gift-tags" id="gifts-flavio"></div>
    </div>

    <div class="hud-side right">
      <div class="hud-name">LULA</div>
      <div class="hud-votes" id="votes-lula"></div>
      <div class="bar hp"><i id="hpbar-lula" style="width:100%"></i><span class="label-in" id="hpval-lula">HP</span></div>
      <div class="bar sh"><i id="shbar-lula" style="width:100%"></i><span class="label-in" id="shval-lula">ESCUDO</span></div>
      <div class="gift-tags" id="gifts-lula"></div>
    </div>
  </div>

  <div class="shield-fx left" id="shield-flavio"></div>
  <div class="shield-fx right" id="shield-lula"></div>

  <div class="fighter" id="fighter-flavio"><img id="img-flavio" alt=""></div>
  <div class="fighter" id="fighter-lula"><img id="img-lula" alt=""></div>
  <div class="hit" id="hit"></div>
  <div class="float-text" id="floatText"></div>
  <div class="win-banner" id="winBanner">
    <div class="big" id="winBig"></div>
    <div class="sub" id="winSub"></div>
  </div>

  <div class="debug" id="debug" style="display:none"></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const DEBUG = params.get("debug") === "1";
const token = params.get("tk") || localStorage.getItem("token");
if (!token && !DEBUG) location.href = "/login";

const FIGHTERS = {
  flavio: {
    name: "FLÁVIO", dir: 1,
    sprites: { idle: "/duelo/Flavio/neutro.png", defense: "/duelo/Flavio/defesa.png", punch: "/duelo/Flavio/soco.png", kick: "/duelo/Flavio/chute.png", uppercut: "/duelo/Flavio/levantada.png", victory: "/duelo/Flavio/vitoria.png" },
  },
  lula: {
    name: "LULA", dir: -1,
    sprites: { idle: "/duelo/lula/neutro.png", defense: "/duelo/lula/defesa.png", punch: "/duelo/lula/soco.png", kick: "/duelo/lula/chute.png", uppercut: "/duelo/lula/levantada.png", victory: "/duelo/lula/vitoria.png" },
  },
};

const ACTION_DUR = { punch: { fwd: 300, hold: 120, back: 130 }, kick: { fwd: 380, hold: 160, back: 160 }, uppercut: { fwd: 420, hold: 200, back: 180 } };
const MAX_ATTACK_QUEUE = 20;

let state = { mode: "hp", hp: { flavio: 0, lula: 0 }, shield: { flavio: 0, lula: 0 }, votes: { flavio: 0, lula: 0 }, hp_max: 100, shield_max: 200, winner: null, roundActive: true, final: false, active: false };
let attackQueue = [];
let busy = false;
let currentCombo = 0;
let dueloGifts = [];

const GIFT_ACTION_LABEL = { punch: "Soco", kick: "Chute", uppercut: "Levantada" };

function renderGiftTags() {
  for (const f of ["flavio", "lula"]) {
    const el = $("gifts-" + f);
    if (!el) continue;
    const list = dueloGifts.filter((g) => g && g.active !== false && (g.character || f) === f);
    if (!list.length) { el.replaceChildren(); continue; }
    const head = document.createElement("div");
    head.className = "gift-head";
    head.textContent = "PRESENTES";
    const tags = list.map((g) => {
      const span = document.createElement("span");
      const isEsc = String(g.type || "").toLowerCase() === "escudo";
      span.className = "gift-tag " + (isEsc ? "esc" : "atk");
      if (g.image) {
        const img = document.createElement("img");
        img.src = g.image;
        img.alt = "";
        img.onerror = function () { this.style.display = "none"; };
        span.appendChild(img);
      }
      const label = document.createElement("span");
      const nome = new Option(g.name || "?");
      const acao = isEsc ? "Escudo" : (GIFT_ACTION_LABEL[g.action] || "Soco");
      label.textContent = `${nome.value} · ${acao}`;
      span.appendChild(label);
      return span;
    });
    el.replaceChildren(head, ...tags);
  }
}

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const opponent = (f) => (f === "flavio" ? "lula" : "flavio");

function setFighter(fighter, stateName) {
  const img = $("img-" + fighter);
  const url = FIGHTERS[fighter].sprites[stateName] || FIGHTERS[fighter].sprites.idle;
  if (img) {
    img.onerror = function () { if (this.src.indexOf("vitoria") !== -1) this.src = FIGHTERS[fighter].sprites.idle; };
    img.src = url;
  }
  const el = $("fighter-" + fighter);
  if (el) el.dataset.state = stateName;
}

function resetPose(fighter) {
  const el = $("fighter-" + fighter);
  setFighter(fighter, "idle");
  if (el) { el.classList.remove("attacking"); el.classList.remove("winner"); el.classList.remove("down"); el.classList.remove("victory-enter"); el.style.transition = "transform .28s ease"; el.style.transform = "translate(0,0) scale(1)"; }
}

function pctBar(v, max) { return Math.max(0, Math.min(100, (v / (max || 1)) * 100)); }

function renderHud() {
  const hpMax = state.hp_max || 100;
  const shMax = state.shield_max || 200;
  for (const f of ["flavio", "lula"]) {
    const hpEl = $("hpbar-" + f);
    if (hpEl) hpEl.style.width = pctBar(state.hp[f], hpMax) + "%";
    const shEl = $("shbar-" + f);
    if (shEl) shEl.style.width = pctBar(state.shield[f], shMax) + "%";
    const hpL = $("hpval-" + f);
    if (hpL) hpL.textContent = "HP " + (state.hp[f] || 0) + " / " + hpMax;
    const shL = $("shval-" + f);
    if (shL) shL.textContent = "ESCUDO " + (state.shield[f] || 0) + " / " + shMax;
    const vr = $("votes-" + f);
    if (vr) {
      if (state.mode === "votes") vr.textContent = state.votes[f] + (state.votes[f] === 1 ? " VOTO" : " VOTOS");
      else vr.textContent = "";
    }
  }
  const vs = $("htVs");
  if (vs) {
    vs.textContent = state.mode === "votes"
      ? `${state.votes.flavio} VS ${state.votes.lula}`
      : "";
    vs.classList.toggle("has", vs.textContent.length > 0);
  }
}

function clearWinnerVisual() {
  const banner = $("winBanner");
  if (banner) banner.classList.remove("show");
  for (const f of ["flavio", "lula"]) {
    const el = $("fighter-" + f);
    if (el) { el.classList.remove("winner"); el.classList.remove("down"); el.classList.remove("victory-enter"); }
  }
}

function renderWinner() {
  if (!state.winner) { clearWinnerVisual(); return; }
  const winner = state.winner;
  const loser = opponent(winner);
  // Pose PERSISTENTE: vencedor em victory e perdedor "down" enquanto state.winner preenchido.
  setFighter(winner, "victory");
  setFighter(loser, "idle");
  const wEl = $("fighter-" + winner);
  const lEl = $("fighter-" + loser);
  if (wEl) {
    wEl.classList.remove("attacking");
    wEl.style.transform = "translate(0,0) scale(1)";
    wEl.classList.add("winner");
    if (!wEl.classList.contains("victory-enter")) {
      wEl.classList.add("victory-enter");
      setTimeout(() => { const el = $("fighter-" + winner); if (el) el.classList.remove("victory-enter"); }, 750);
    }
  }
  if (lEl) {
    lEl.classList.remove("attacking");
    lEl.style.transform = "translate(0,0) scale(1)";
    lEl.classList.add("down");
  }

  const banner = $("winBanner");
  const big = $("winBig");
  const sub = $("winSub");
  if (banner) {
    const w = FIGHTERS[winner].name;
    if (state.final) { big.textContent = "VENCEDOR FINAL"; sub.textContent = `${w.toUpperCase()} GANHOU`; }
    else if (state.mode === "votes") { big.textContent = `${w.toUpperCase()} GANHOU 1 VOTO`; sub.textContent = `VOTOS: ${state.votes.flavio} x ${state.votes.lula}`; }
    else { big.textContent = `${w.toUpperCase()} VENCEU A RODADA!`; sub.textContent = "Aguardando nova rodada…"; }
    banner.classList.add("show");
  }
}

function applyState(s) {
  if (!s) return;
  const prevInactive = !state.roundActive || !!state.winner;
  state = Object.assign({}, state, s);
  renderHud();
  renderWinner();
  if (s.winner) {
    attackQueue = [];
    busy = false;
  }
  const roundReset = !s.winner && s.roundActive && prevInactive;
  if (roundReset) {
    attackQueue = [];
    busy = false;
    currentCombo = 0;
    resetPose("flavio");
    resetPose("lula");
    $("combo") && clearCombo();
    $("htVs") && renderHud();
  }
  try { console.debug("[DUELO STATE]", { mode: state.mode, hp: state.hp, hp_max: state.hp_max, shield: state.shield, shield_max: state.shield_max, winner: state.winner, roundActive: state.roundActive, final: state.final }); } catch (e) {}
}

function updateCombo() {
  if (state.winner) return;
  const c = $("combo");
  if (!c) return;
  if (currentCombo > 1) { c.textContent = "x" + currentCombo; c.classList.add("show"); }
  else { c.textContent = ""; c.classList.remove("show"); }
}
function clearCombo() { const c = $("combo"); if (c) { c.textContent = ""; c.classList.remove("show"); } }

function spawnHit(type, dir) {
  const hit = $("hit");
  if (!hit) return;
  hit.style.left = (dir > 0 ? 56 : 44) + "%";
  hit.className = "hit " + (type === "uppercut" ? "uppercut" : type) + " show";
  setTimeout(() => { hit.className = "hit"; hit.style.left = "50%"; }, 380);
}

function playAudio(url) {
  if (!url) return;
  try { const a = new Audio(url); a.volume = 0.92; a.play().catch(() => {}); } catch (e) {}
}

function shieldEffect(fighter, points) {
  const fx = $("shield-" + fighter);
  if (fx) { fx.classList.remove("show"); void fx.offsetWidth; fx.classList.add("show"); setTimeout(() => fx.classList.remove("show"), 850); }
  const ft = $("floatText");
  if (ft) {
    ft.textContent = "+" + points + " ESCUDO";
    ft.classList.remove("show"); void ft.offsetWidth; ft.classList.add("show");
    setTimeout(() => ft.classList.remove("show"), 1000);
  }
}

function enqueueAttack(att) {
  if (!att || !FIGHTERS[att.attacker]) return;
  // Presentes reais: bloqueados durante banner/final. Testes (isTest) passam sempre.
  if (!att.isTest && (!state.roundActive || state.winner)) return;
  attackQueue.push(att);
  if (attackQueue.length > MAX_ATTACK_QUEUE) attackQueue.shift();
  processQueue();
}

async function processQueue() {
  if (busy || !attackQueue.length) return;
  if (!state.roundActive || state.winner) {
    // Parado: mantém a fila só se houver testes visuais; senão descarta reais.
    if (!attackQueue.some((a) => a.isTest)) { attackQueue = []; return; }
  }
  busy = true;
  const att = attackQueue.shift();
  try { await runAttack(att); } catch (e) {}
  if (!state.roundActive && !att.isTest) { attackQueue = []; }
  if (state.winner) {
    renderWinner(); // mantém vencedor em pose de vitória / perdedor down
  } else {
    resetPose("flavio");
    resetPose("lula");
  }
  if (!att.isTest) updateCombo();
  setTimeout(() => { busy = false; processQueue(); }, 150);
}

async function runAttack(att) {
  const a = FIGHTERS[att.attacker];
  const def = opponent(att.attacker);
  const dur = ACTION_DUR[att.action] || ACTION_DUR.punch;
  const dir = a.dir;
  const move = att.action === "uppercut" ? 30 : (att.action === "kick" ? 46 : 34);

  // Teste visual durante banner de vitória: esconde o banner apenas localmente.
  if (att.isTest && state.winner) {
    const banner = $("winBanner");
    if (banner) banner.classList.remove("show");
  }

  setFighter(att.attacker, att.action);
  setFighter(def, "defense");
  const atEl = $("fighter-" + att.attacker);
  const deEl = $("fighter-" + def);
  if (atEl) {
    atEl.classList.add("attacking");
    atEl.style.transition = `transform ${dur.fwd}ms ease-out`;
    const up = att.action === "uppercut" ? " translateY(-18px)" : " translateY(0)";
    const sc = att.action === "kick" ? " scale(1.05)" : " scale(1)";
    atEl.style.transform = `translateX(${dir * move}px)${up}${sc}`;
  }
  if (deEl) { deEl.style.transition = `transform ${dur.fwd}ms ease-in`; deEl.style.transform = `translateX(${-dir * 14}px)`; }
  await sleep(dur.fwd);
  if (deEl) deEl.style.transform = `translateX(${-dir * 30}px)`;
  spawnHit(att.action, dir);
  if (att.combo > 0) { currentCombo = att.combo; updateCombo(); }
  playAudio(att.audio_url);
  await sleep(dur.hold);
  if (state.winner) { renderWinner(); } else { resetPose(att.attacker); resetPose(def); }
  await sleep(dur.back);
}

// ---- WebSocket ----
function connectWS() {
  if (!token) return;
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/browser?token=${encodeURIComponent(token)}`);
  ws.onopen = () => { $("statusText").textContent = "conectado"; };
  ws.onclose = (e) => {
    if (e && e.code === 1008) { $("statusText").textContent = "sessão inválida — redirecionando…"; location.href = "/login"; return; }
    $("statusText").textContent = "desconectado — reconectando…";
    setTimeout(connectWS, 3000);
  };
  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.type === "duelo_state") applyState(msg);
    else if (msg.type === "duelo_attack") enqueueAttack({ attacker: msg.attacker, action: msg.action, combo: msg.combo || 1, audio_url: msg.audio_url || "", isTest: !!msg.isTest });
    else if (msg.type === "duelo_shield") { shieldEffect(msg.fighter, msg.points || 0); playAudio(msg.audio_url || ""); }
    else if (msg.type === "duelo_gifts") { dueloGifts = Array.isArray(msg.gifts) ? msg.gifts : []; renderGiftTags(); }
  };
}

async function loadInitialState() {
  try {
    const res = await fetch("/api/duelo/state", { headers: { Authorization: "Bearer " + token } });
    const data = await res.json();
    if (data && data.success && data.settings) {
      const s = data.settings;
      state.mode = s.mode === "votes" ? "votes" : "hp";
      const hpStart = !isNaN(Number(s.hp_start)) ? Number(s.hp_start) : 100;
      const shStart = !isNaN(Number(s.shield_start)) ? Number(s.shield_start) : 0;
      state.hp_max = !isNaN(Number(s.hp_max)) ? Number(s.hp_max) : 100;
      state.shield_max = !isNaN(Number(s.shield_max)) ? Number(s.shield_max) : hpStart;
      state.hp = { flavio: hpStart, lula: hpStart };
      state.shield = { flavio: shStart, lula: shStart };
      renderHud();
    }
    if (data && Array.isArray(data.gifts)) { dueloGifts = data.gifts; renderGiftTags(); }
  } catch (e) { renderHud(); }
}

// ---- Bootstrap ----
resetPose("flavio");
resetPose("lula");
renderHud();
renderGiftTags();
loadInitialState();

if (DEBUG) {
  const dbg = $("debug");
  dbg.style.display = "flex";
  ["flavio", "lula"].forEach((f) => {
    [["punch", "Soco"], ["kick", "Chute"], ["uppercut", "Levantada"]].forEach(([action, label]) => {
      const b = document.createElement("button");
      b.className = f;
      b.textContent = `${FIGHTERS[f].name} ${label}`;
      b.onclick = () => enqueueAttack({ attacker: f, action, combo: 1, audio_url: "", isTest: true });
      dbg.appendChild(b);
    });
  });
}

connectWS();
</script>
