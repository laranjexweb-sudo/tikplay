<!DOCTYPE html>
<html lang="pt-BR">
<head>

<style>
  :root {

  }
  .stage { width: 100%; height: 100%; min-width: 0; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: var(--live-safe-top) minmax(0, 1fr) var(--live-safe-bottom); padding-inline: var(--live-safe-left) var(--live-safe-right); }
  .wrap { grid-row: 2; justify-self: center; width: 100%; max-width: 110rem; height: 100%; min-width: 0; min-height: 0; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(var(--tp-space-1), 1.2svh, var(--tp-space-3)); container: caca-layout / inline-size; }

  .status-pill { display: inline-flex; align-items: center; gap: var(--tp-space-1); padding: .1rem var(--tp-space-2); border: var(--tp-line) solid var(--caca-line); border-radius: 999px; background: color-mix(in srgb, var(--caca-surface) 75%, transparent); color: var(--tp-yellow-soft); font-size: .68em; font-weight: 750; white-space: nowrap; }
  .status-pill::before { content: ""; width: .5em; aspect-ratio: 1; border-radius: 50%; background: var(--tp-yellow); }

  .progress-card { display: flex; align-items: center; justify-content: flex-start; flex-wrap: wrap; gap: var(--tp-space-1) var(--tp-space-3); margin: var(--tp-space-1) 0 0; width: 100%; max-width: 100%; padding: 0; border: 0; border-radius: 0; background: transparent; }

  .tp-card.caca-panel { gap: var(--tp-space-2); min-width: 0; padding: clamp(var(--tp-space-2), 2vw, var(--tp-space-4)); border: var(--tp-line) solid var(--caca-line); border-radius: var(--tp-radius-lg); background: linear-gradient(145deg, color-mix(in srgb, var(--caca-surface) 95%, transparent), color-mix(in srgb, var(--tp-black) 88%, transparent)); box-shadow: 0 .5rem 1.75rem color-mix(in srgb, var(--tp-black) 32%, transparent); }
  .game-content { position: relative; min-width: 0; min-height: 0; flex: 1 1 auto; display: flex; flex-direction: column; gap: clamp(var(--tp-space-1), 1svh, var(--tp-space-3)); overflow: visible; padding-top: clamp(2.75rem, 5svh, 4rem); }
  .board-panel { width: 100%; min-height: 0; flex: 1 1 auto; display: flex; flex-direction: column; }
  .game-content.is-finished.has-final-ranking { justify-content: center; }
  .game-content.is-finished.has-final-ranking .board-panel { display: none; }
  .section-heading { display: flex; align-items: center; justify-content: space-between; gap: var(--tp-space-2); text-align: left; }

  .section-heading span { color: var(--caca-muted); font-size: .75rem; }
  #boardWrap { width: 100%; min-width: 0; min-height: 0; flex: 1 1 auto; display: flex; align-items: center; justify-content: center; }
  .board { width: min(100%, 82svh); height: auto; max-width: 100%; max-height: 100%; aspect-ratio: 1; flex: 0 1 auto; display: grid; grid-auto-rows: minmax(0, 1fr); grid-template-columns: minmax(1.35rem, 1.75rem) repeat(10, minmax(0, 1fr)); gap: clamp(.12rem, .45vw, .35rem); padding: clamp(.25rem, .8vw, .6rem); border: var(--tp-line) solid color-mix(in srgb, var(--caca-cyan) 58%, transparent); border-radius: var(--tp-radius-lg); background: color-mix(in srgb, var(--tp-black) 78%, transparent); box-shadow: 0 .35rem 1.4rem color-mix(in srgb, var(--tp-blue) 14%, transparent); }
  .cell-label { min-width: 0; display: flex; align-items: center; justify-content: center; color: var(--caca-cyan); font-size: clamp(.62rem, 1.35vw, .9rem); font-weight: 900; font-variant-numeric: tabular-nums; user-select: none; }
  .cell { position: relative; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; border: var(--tp-line) solid color-mix(in srgb, var(--tp-text-inverse) 9%, transparent); border-radius: clamp(.25rem, .65vw, .55rem); background: color-mix(in srgb, var(--tp-text-inverse) 6%, var(--tp-black-2)); color: color-mix(in srgb, var(--tp-text-inverse) 92%, var(--tp-blue)); font-size: clamp(.9rem, 3.8vw, 2.55rem); font-weight: 900; line-height: 1; user-select: none; }
  .cell.found { border-color: color-mix(in srgb, var(--pcolor, var(--tp-yellow)) 76%, transparent); background: color-mix(in srgb, var(--pcolor, var(--tp-yellow)) 17%, var(--tp-black-2)); color: var(--pcolor, var(--tp-yellow-soft)); box-shadow: inset 0 0 0 var(--tp-line) color-mix(in srgb, var(--pcolor, var(--tp-yellow)) 40%, transparent); }
  .cell.found.p-found { background: color-mix(in srgb, var(--pcolor, var(--tp-yellow)) 20%, var(--tp-black-2)); }
  .cell-finder-avatar { position: absolute; z-index: 2; top: 0; right: 0; width: .62rem; height: .62rem; border-width: 0; background: var(--tp-black); box-shadow: 0 0 .2rem color-mix(in srgb, var(--tp-black) 85%, transparent); }
  .cell-finder-avatar .caca-avatar-fallback { font-size: .34rem; }
  .words-panel { display: none !important; width: 100%; flex: 0 0 auto; }
  .words-bar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--tp-space-1); }
  .wchip { min-width: 0; min-height: 1.75rem; max-width: 100%; display: inline-flex; align-items: center; gap: var(--tp-space-1); padding: var(--tp-space-1) var(--tp-space-2); overflow: hidden; border: var(--tp-line) solid var(--caca-line); border-radius: 999px; background: color-mix(in srgb, var(--tp-black) 35%, var(--caca-surface)); color: var(--caca-muted); font-size: clamp(.68rem, 1.4vw, .84rem); font-weight: 750; }
  .word-index { flex: 0 0 auto; color: color-mix(in srgb, var(--caca-muted) 75%, transparent); font-size: .72em; font-variant-numeric: tabular-nums; }
  .word-mask { color: color-mix(in srgb, var(--tp-text-inverse) 45%, var(--tp-black-3)); letter-spacing: .12em; }
  .wchip.found { border-color: color-mix(in srgb, var(--pcolor, var(--tp-yellow)) 58%, transparent); background: color-mix(in srgb, var(--pcolor, var(--tp-yellow)) 11%, var(--caca-surface)); color: var(--pcolor, var(--tp-yellow-soft)); }
  .caca-avatar { width: 1.45rem; height: 1.45rem; flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; overflow: hidden; border: var(--tp-line) solid var(--caca-line); border-radius: 50%; background: var(--caca-surface-raised); color: var(--tp-text-inverse); font-size: .62rem; font-weight: 900; line-height: 1; }
  .word-finder-avatar { width: 1.45rem; height: 1.45rem; }
  .caca-avatar img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .caca-avatar-fallback[hidden] { display: none; }
  .word-finder-name { max-width: 7rem; overflow: hidden; color: var(--tp-text-inverse); font-size: .76em; text-overflow: ellipsis; white-space: nowrap; }
  .word-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wchip .coord { flex: 0 0 auto; margin-left: auto; color: var(--caca-cyan); font-size: .76em; font-weight: 800; white-space: nowrap; }
  .wchip.found .coord { color: color-mix(in srgb, var(--pcolor, var(--tp-yellow)) 70%, var(--tp-text-inverse)); }
  .caca-toast { position: absolute; z-index: var(--z-toast); top: 0; left: 50%; width: min(88%, 30rem); min-height: clamp(2.75rem, 5svh, 3.5rem); display: flex; align-items: center; gap: var(--tp-space-2); padding: var(--tp-space-1) var(--tp-space-3); border: var(--tp-line) solid color-mix(in srgb, var(--tp-green) 55%, var(--caca-line)); border-radius: var(--tp-radius-lg); background: color-mix(in srgb, var(--caca-surface) 96%, transparent); box-shadow: 0 .6rem 2rem color-mix(in srgb, var(--tp-black) 48%, transparent); opacity: 0; pointer-events: none; transform: translate(-50%, -.4rem) scale(.98); transition: opacity 180ms ease, transform 180ms ease; }
  .caca-toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  .toast-check { flex: 0 0 auto; color: var(--tp-green); font-size: 1.2rem; font-weight: 900; }
  .caca-toast .caca-avatar { width: 2.1rem; height: 2.1rem; font-size: .82rem; }
  .toast-copy { min-width: 0; display: flex; flex-direction: column; gap: .15rem; text-align: left; }
  .toast-title { overflow: hidden; color: var(--tp-text-inverse); font-size: .88rem; font-weight: 850; text-overflow: ellipsis; white-space: nowrap; }
  .toast-detail { color: var(--caca-muted); font-size: .73rem; }
  .empty { width: 100%; padding: var(--tp-space-8) var(--tp-space-3); border: var(--tp-line) dashed var(--caca-line); border-radius: var(--tp-radius-lg); color: var(--caca-muted); font-size: clamp(.9rem, 2vw, 1.15rem); text-align: center; }
  .finished-banner { display: none; padding: var(--tp-space-2) var(--tp-space-3); border: var(--tp-line) solid color-mix(in srgb, var(--tp-yellow) 62%, transparent); border-radius: var(--tp-radius-md); background: color-mix(in srgb, var(--tp-yellow) 12%, var(--caca-surface)); color: var(--tp-yellow-soft); font-size: clamp(.8rem, 1.8vw, 1rem); font-weight: 900; letter-spacing: .08em; text-align: center; }
  .caca-ranking { display: none; flex: 0 0 auto; padding: var(--tp-space-2) var(--tp-space-3); border: var(--tp-line) solid color-mix(in srgb, var(--tp-yellow) 35%, var(--caca-line)); border-radius: var(--tp-radius-lg); background: color-mix(in srgb, var(--caca-surface) 94%, transparent); }
  .caca-ranking h3 { margin: 0 0 var(--tp-space-2); color: var(--tp-yellow-soft); font-size: clamp(.8rem, 1.8vw, 1rem); font-weight: 900; letter-spacing: .06em; text-align: left; }
  .cr-row { min-width: 0; display: flex; align-items: center; gap: var(--tp-space-2); padding: var(--tp-space-1) var(--tp-space-2); border-radius: var(--tp-radius-sm); }
  .cr-row:nth-child(odd) { background: color-mix(in srgb, var(--tp-text-inverse) 4%, transparent); }
  .cr-medal { width: 2rem; flex: 0 0 auto; color: var(--tp-yellow-soft); font-size: 1rem; text-align: center; }
  .cr-avatar { width: 2rem; height: 2rem; flex: 0 0 auto; border: var(--tp-line) solid var(--caca-line); border-radius: 50%; background: var(--caca-surface-raised); object-fit: cover; }
  .cr-name { min-width: 0; flex: 1; overflow: hidden; color: var(--tp-text-inverse); font-size: .85rem; font-weight: 750; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
  .cr-count { flex: 0 0 auto; color: var(--tp-yellow-soft); font-size: .78rem; font-weight: 850; white-space: nowrap; }
  .footer { display: none; }
  @container caca-layout (max-width: 32rem) {
    .section-heading { flex-direction: column; align-items: flex-start; gap: var(--tp-space-1); }
  }
  @media (max-width: 32rem) {
    .cell { font-size: clamp(.9rem, 5.6vw, 1.6rem); }
    .cr-row { gap: var(--tp-space-1); }
  }
  @media (max-height: 64rem) {
    .head-title { font-size: clamp(1.2rem, 3.2vw, 2.4rem); }
    .tp-card.caca-panel { padding: var(--tp-space-2); }
    .section-heading span { font-size: .68rem; }
  }
  @media (max-height: 48rem) {
    .wrap { gap: var(--tp-space-1); }
    .header-line { margin-top: var(--tp-space-1); }
    .progress-card { margin-top: var(--tp-space-1); }
    .tp-card.caca-panel { padding: var(--tp-space-1) var(--tp-space-2); }
  }
  @media (min-aspect-ratio: 4/3) {
    .game-header { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; text-align: left; }
    .head-title { grid-column: 1; }
    .header-line { grid-column: 1; justify-content: flex-start; margin-top: var(--tp-space-1); }
    .progress-card { grid-column: 1 / -1; }
    .board { width: min(100%, 78svh); }
  }
  @media (prefers-reduced-motion: reduce) { .progress-fill, .caca-toast { transition: none; } }
</style>

<body>
<div class="stage">
  <div class="wrap">
    <header class="game-header">
      <div class="head-title"><span>CAÇA</span> PALAVRAS</div>
      <div class="header-line">
        <p class="head-sub" id="cacaAnswerHint"></p>
        <span class="status-pill" id="roundStatus">Aguardando partida</span>
      </div>
      <div class="progress-card" aria-label="Progresso da partida">
        <div class="progress-count"><strong id="foundCount">0</strong><span>de <span id="totalCount">0</span> palavras</span></div>
        <div class="progress-track" role="progressbar" aria-label="Palavras encontradas" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div>
        <div class="live-leader" id="liveLeader" aria-live="polite"></div>
      </div>
    </header>

    <main class="game-content">
      <div class="caca-toast" id="cacaToast" role="status" aria-live="polite"></div>
      <section class="tp-card caca-panel board-panel" id="boardPanel" aria-label="Tabuleiro de caça palavras">
        <div class="section-heading"><h2>Encontre as palavras</h2><span id="cacaCoordHint">Letra = linha · número = coluna</span></div>
        <div id="boardWrap"><div class="empty">Aguardando partida...</div></div>
      </section>
      <section class="tp-card caca-panel words-panel" id="wordsPanel" aria-label="Lista de palavras">
        <div class="section-heading"><h2>Acertos recentes</h2><span>Últimas palavras encontradas</span></div>
        <div class="words-bar" id="wordsBar"></div>
      </section>
      <div class="finished-banner" id="finishedBanner">Todas as palavras encontradas!</div>
      <div class="caca-ranking" id="cacaRanking"></div>
    </main>
    <footer class="footer" id="cacaFooterHint"></footer>
  </div>
</div>

<script>
const q = new URLSearchParams(location.search);
const token = q.get("tk") || localStorage.getItem("token");
if (!token) location.href = "/login";
const room = new URLSearchParams(location.search).get("room") || "";
let state = null;
let ws = null;
const cacaFoundOrder = new Map();

function recentFoundWords(words) {
  const found = (words || []).filter(word => word.found);
  const byId = new Map(found.map(word => [String(word.id), word]));
  for (const word of found) {
    const id = String(word.id);
    if (!cacaFoundOrder.has(id)) cacaFoundOrder.set(id, word);
  }
  return [...cacaFoundOrder.keys()]
    .map(id => byId.get(id) || cacaFoundOrder.get(id))
    .filter(word => word && (word.found || byId.has(String(word.id))))
    .slice(-4);
}

function authFetch(path, opts = {}) {
  const headers = { ...(opts.headers || {}), Authorization: "Bearer " + token };
  return fetch(path, { ...opts, headers });
}

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

function safeAvatarUrl(value) {
  const raw = String(value || "").trim();
  if (!raw) return "";
  try {
    const url = new URL(raw, location.origin);
    return ["http:", "https:"].includes(url.protocol) ? url.href : "";
  } catch { return ""; }
}

function playerInitials(name) {
  const parts = String(name || "").trim().split(/\s+/u).filter(Boolean);
  if (!parts.length) return "?";
  return Array.from(parts.length > 1 ? parts[0][0] + parts[parts.length - 1][0] : parts[0][0]).slice(0, 2).join("").toLocaleUpperCase("pt-BR");
}

function avatarMarkup(name, avatar, className = "caca-avatar") {
  const initials = esc(playerInitials(name));
  const src = safeAvatarUrl(avatar);
  return `<span class="${className}" aria-label="${esc(name || "Participante")}">${src ? `<img src="${esc(src)}" alt="" onerror="this.hidden=true;this.nextElementSibling.hidden=false">` : ""}<span class="caca-avatar-fallback"${src ? " hidden" : ""}>${initials}</span></span>`;
}

function createPlayerAvatar(name, avatar) {
  const wrapper = document.createElement("span");
  wrapper.className = "caca-avatar";
  wrapper.setAttribute("aria-label", name || "Participante");
  const fallback = document.createElement("span");
  fallback.className = "caca-avatar-fallback";
  fallback.textContent = playerInitials(name);
  const src = safeAvatarUrl(avatar);
  if (src) {
    const image = document.createElement("img");
    image.alt = "";
    image.src = src;
    image.addEventListener("error", () => { image.hidden = true; fallback.hidden = false; }, { once: true });
    fallback.hidden = true;
    wrapper.append(image, fallback);
  } else wrapper.append(fallback);
  return wrapper;
}

function applyDisplaySettings(display) {
  const safe = display && typeof display === "object" ? display : {};
  const values = {
    top: Math.max(0, Math.min(35, Number(safe.safe_top ?? 13))),
    bottom: Math.max(0, Math.min(35, Number(safe.safe_bottom ?? 22))),
    left: Math.max(0, Math.min(20, Number(safe.safe_left ?? 4))),
    right: Math.max(0, Math.min(20, Number(safe.safe_right ?? 4))),
  };
  const root = document.documentElement;
  for (const [key, value] of Object.entries(values)) root.style.setProperty(`--live-safe-${key}`, `${value}%`);
  document.body.dataset.layout = ["vertical", "landscape", "custom"].includes(safe.preset) ? safe.preset : "vertical";
}

const PLAYER_COLORS = [
  "#ffd700", "#00e5ff", "#ff2ec4", "#b026ff", "#4aff4a",
  "#ff6b6b", "#ffa500", "#7cffcb", "#ff9a3d", "#6ee7ff",
  "#f472b6", "#a3e635", "#fb7185", "#38bdf8", "#e879f9",
  "#fbbf24", "#34d399", "#f87171", "#60a5fa", "#c084fc"
];
function playerColor(user) {
  let h = 0;
  const s = String(user || "?");
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return PLAYER_COLORS[h % PLAYER_COLORS.length];
}

function render() {
  renderCacaInstructions();
  if (!state || !state.board || !state.board.length) {
    document.getElementById("boardWrap").innerHTML = '<div class="empty">Aguardando partida...</div>';
    document.getElementById("wordsBar").innerHTML = "";
    document.getElementById("foundCount").textContent = "0";
    document.getElementById("totalCount").textContent = "0";
    document.getElementById("roundStatus").textContent = "Aguardando partida";
    document.getElementById("roundStatus").className = "status-pill";
    document.getElementById("progressFill").style.width = "0%";
    document.querySelector(".progress-track").setAttribute("aria-valuemax", "0");
    document.querySelector(".progress-track").setAttribute("aria-valuenow", "0");
    document.getElementById("wordsPanel").style.display = "none";
    document.getElementById("liveLeader").textContent = "";
    document.querySelector(".game-content").classList.remove("is-finished", "has-final-ranking");
    document.getElementById("finishedBanner").style.display = "none";
    renderRanking();
    applyCacaView();
    return;
  }

  const size = state.size || 10;
  const boardEl = document.createElement("div");
  boardEl.className = "board";
  boardEl.style.gridTemplateColumns = `minmax(1.35rem, 1.75rem) repeat(${size}, minmax(0, 1fr))`;

  // Mapa de células que pertencem a palavras encontradas
  const cellMeta = {};
  for (const w of state.words || []) {
    if (!w.found) continue;
    const p1 = parse(w.start), p2 = parse(w.end);
    const cells = segment(p1, p2);
    for (const {r, c, idx} of cells) {
      const key = r + "_" + c;
      cellMeta[key] = { word: w, idx };
    }
  }

  // Cabeçalho de colunas (1..size) + célula do canto
  const corner = document.createElement("div");
  corner.className = "cell-label";
  boardEl.appendChild(corner);
  for (let c = 1; c <= size; c++) {
    const lbl = document.createElement("div");
    lbl.className = "cell-label";
    lbl.textContent = c;
    boardEl.appendChild(lbl);
  }

  for (let r = 0; r < size; r++) {
    // Identificação da linha (A..J)
    const rowLabel = document.createElement("div");
    rowLabel.className = "cell-label";
    rowLabel.textContent = String.fromCharCode(65 + r);
    boardEl.appendChild(rowLabel);

    for (let c = 0; c < size; c++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.dataset.row = String(r);
      cell.dataset.col = String(c);
      const meta = cellMeta[r + "_" + c];
      if (meta) {
        const color = playerColor(meta.word.finder || meta.word.finder_nickname);
        cell.classList.add("found", "p-found");
        cell.style.setProperty("--pcolor", color);
        cell.textContent = state.board[r][c];
        if (meta.idx === 0) {
          const avatar = createPlayerAvatar(meta.word.finder_nickname || meta.word.finder || "Participante", meta.word.finder_avatar);
          avatar.classList.add("cell-finder-avatar");
          cell.appendChild(avatar);
        }
      } else {
        cell.textContent = state.board[r][c];
      }
      boardEl.appendChild(cell);
    }
  }
  document.getElementById("boardWrap").innerHTML = "";
  document.getElementById("boardWrap").appendChild(boardEl);

  const bar = document.getElementById("wordsBar");
  const recentFound = recentFoundWords(state.words);
  document.getElementById("wordsPanel").style.display = "none";
  bar.innerHTML = recentFound.map(w => {
    const color = playerColor(w.finder || w.finder_nickname);
    const nickname = w.finder_nickname || w.finder || "Participante";
    return `<span class="wchip found" style="--pcolor:${color}">${avatarMarkup(nickname, w.finder_avatar, "caca-avatar word-finder-avatar")}<span class="word-finder-name">${esc(nickname)}</span><span class="word-name">${esc(w.text)}</span><span class="coord">${esc(w.start)}:${esc(w.end)}</span></span>`;
  }).join("");

  const foundCount = Number(state.found_count || 0);
  const totalCount = Number(state.total || (state.words || []).length || 0);
  document.getElementById("foundCount").textContent = foundCount;
  document.getElementById("totalCount").textContent = totalCount;
  const progressTrack = document.querySelector(".progress-track");
  progressTrack.setAttribute("aria-valuemax", String(totalCount));
  progressTrack.setAttribute("aria-valuenow", String(foundCount));
  document.getElementById("progressFill").style.width = `${totalCount ? Math.min(100, foundCount / totalCount * 100) : 0}%`;
  const status = document.getElementById("roundStatus");
  status.textContent = state.finished ? "Partida finalizada" : state.active ? "Rodada em andamento" : "Aguardando partida";
  status.className = `status-pill${state.finished ? " is-finished" : state.active ? " is-active" : ""}`;
  const leaders = Object.values((state.words || []).reduce((acc, word) => {
    if (!word.found || !word.finder) return acc;
    const id = word.finder;
    acc[id] = acc[id] || { name: word.finder_nickname || id, count: 0 };
    acc[id].count++;
    return acc;
  }, {})).sort((a, b) => b.count - a.count);
  const leader = leaders[0];
  const topCount = leader?.count || 0;
  const tiedLeaders = leaders.filter(person => person.count === topCount);
  const leaderText = tiedLeaders.length > 1 ? `Empate · ${topCount} palavra${topCount === 1 ? "" : "s"}` : leader ? `🏆 Líder: ${leader.name} · ${leader.count} palavra${leader.count === 1 ? "" : "s"}` : "";
  document.getElementById("liveLeader").textContent = !state.finished ? leaderText : "";
  document.querySelector(".game-content").classList.toggle("is-finished", !!state.finished);
  document.querySelector(".game-content").classList.toggle("has-final-ranking", !!state.finished && state.show_ranking !== false && leaders.length > 0);
  document.getElementById("finishedBanner").style.display = state.finished ? "block" : "none";
  renderRanking();
  applyCacaView();
}

function renderRanking() {
  const el = document.getElementById("cacaRanking");
  if (!el) return;
  if (!state || !state.finished || state.show_ranking === false) { el.style.display = "none"; el.innerHTML = ""; return; }

  const agg = {};
  for (const w of state.words || []) {
    if (!w.found || !w.finder) continue;
    const k = w.finder;
    agg[k] = agg[k] || { finder: k, nickname: w.finder_nickname || k, avatar: w.finder_avatar || "", count: 0 };
    agg[k].count++;
  }
  const visiblePlaces = window.innerHeight >= 900 ? 5 : 3;
  const list = Object.values(agg).sort((a, b) => b.count - a.count).slice(0, visiblePlaces);
  if (!list.length) { el.style.display = "none"; el.innerHTML = ""; return; }

  const medals = ["🥇", "🥈", "🥉"];
  el.style.display = "block";
  el.innerHTML =
    "<h3>🏆 RANKING DA RODADA</h3>" +
    list.map((r, i) =>
      `<div class="cr-row">
         <span class="cr-medal">${medals[i] || (i + 1) + "º"}</span>
         ${avatarMarkup(r.nickname, r.avatar, "caca-avatar cr-avatar")}
         <span class="cr-name">${esc(r.nickname)}</span>
         <span class="cr-count">${r.count} palavra${r.count > 1 ? "s" : ""}</span>
       </div>`
    ).join("");
}

function applyCacaView() {
  const words = document.getElementById("wordsPanel");
  const banner = document.getElementById("finishedBanner");
  const ranking = document.getElementById("cacaRanking");
  if (words) words.style.display = "none";
  if (banner) banner.style.display = state?.finished ? "block" : "none";
  if (ranking) ranking.style.display = state?.finished && state?.show_ranking !== false ? "block" : "none";
}

function renderCacaInstructions() {
  const mode = ["word", "coordinates", "both"].includes(state?.answer_mode) ? state.answer_mode : "both";
  const messages = {
    word: { header: "Envie a palavra no chat", footer: "Envie a palavra encontrada no chat da live.", coords: false },
    coordinates: { header: "Envie coordenadas · exemplo: B2 F6", footer: "Envie as coordenadas de início e fim no chat da live.", coords: true },
    both: { header: "Envie a palavra ou coordenadas · B2 F6", footer: "Envie a palavra encontrada ou as coordenadas no chat da live.", coords: true },
  }[mode];
  const header = document.getElementById("cacaAnswerHint");
  const footer = document.getElementById("cacaFooterHint");
  const coordHint = document.getElementById("cacaCoordHint");
  if (header) header.textContent = messages.header;
  if (footer) footer.textContent = messages.footer;
  if (coordHint) coordHint.hidden = !messages.coords;
}

function parse(coord) {
  coord = String(coord || "").toUpperCase();
  const letter = coord[0];
  const num = parseInt(coord.slice(1), 10);
  return { r: letter.charCodeAt(0) - 65, c: num - 1 };
}

function segment(p1, p2) {
  const dr = Math.sign(p2.r - p1.r);
  const dc = Math.sign(p2.c - p1.c);
  const len = Math.max(Math.abs(p2.r - p1.r), Math.abs(p2.c - p1.c)) + 1;
  const out = [];
  for (let i = 0; i < len; i++) out.push({ r: p1.r + dr * i, c: p1.c + dc * i, idx: i });
  return out;
}

function handle(msg) {
  if (msg.type === "caca_state") {
    if (msg.active && state && !state.active && (state.finished || Number(state.found_count) > 0)) cacaFoundOrder.clear();
    state = msg;
    applyDisplaySettings(state.display);
    recentFoundWords(state.words);
    render();
  } else if (msg.type === "caca_word_found") {
    if (msg.id !== undefined && msg.id !== null) cacaFoundOrder.set(String(msg.id), {
      id: msg.id, text: msg.word, found: true, finder: msg.finder,
      finder_nickname: msg.nickname, finder_avatar: msg.avatar,
      start: msg.start, end: msg.end,
    });
    if (state) render();
    showCacaToast(msg);
  } else if (msg.type === "caca_finished") {
    if (state) state.finished = true;
    render();
  }
}

const cacaToastQueue = [];
let cacaToastBusy = false;
function showCacaToast(result) {
  if (!result || !result.word) return;
  cacaToastQueue.push(result);
  if (cacaToastQueue.length > 5) cacaToastQueue.shift();
  if (!cacaToastBusy) showNextCacaToast();
}
function showNextCacaToast() {
  const toast = document.getElementById("cacaToast");
  const result = cacaToastQueue.shift();
  if (!toast || !result) { cacaToastBusy = false; return; }
  cacaToastBusy = true;
  const copy = document.createElement("div");
  copy.className = "toast-copy";
  const title = document.createElement("span");
  title.className = "toast-title";
  title.textContent = `${result.nickname || result.finder || "Alguém"} encontrou ${result.word}`;
  const detail = document.createElement("span");
  detail.className = "toast-detail";
  detail.textContent = `${result.start || ""}:${result.end || ""} · +1 palavra`;
  copy.append(title, detail);
  toast.replaceChildren(createPlayerAvatar(result.nickname || result.finder || "Alguém", result.avatar), copy);
  requestAnimationFrame(() => toast.classList.add("show"));
  setTimeout(() => {
    toast.classList.remove("show");
    setTimeout(() => { cacaToastBusy = false; showNextCacaToast(); }, 220);
  }, 3000);
}

function connectWS() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/browser?token=${encodeURIComponent(token)}`);
  ws.onmessage = (e) => { try { handle(JSON.parse(e.data)); } catch {} };
  ws.onopen = () => loadState();
  ws.onclose = () => setTimeout(connectWS, 3000);
}

async function loadState() {
  try {
    const res = await authFetch(`/api/caca/state`);
    const d = await res.json();
    if (d && d.success) { state = d; applyDisplaySettings(state.display); render(); }
  } catch (e) {}
}

connectWS();
loadState();
renderCacaInstructions();
applyCacaView();
</script>
</body>
</html>
