<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikPlay - Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/brite/bootstrap.min.css">
<link rel="stylesheet" href="/site/styles.css">
<link rel="stylesheet" href="/ui/tikplay-theme.css">
<link rel="stylesheet" href="/ui/tikplay-admin-buttons.css?v=20261015-auth">
<link rel="stylesheet" href="/ui/tikplay-auth.css?v=20261015-centered-layout2">
</head>
<body class="tp-auth-page">
<main class="tp-auth-main">
  <section class="tp-auth-panel" aria-labelledby="authTitle">
    <a class="brand" href="/" aria-label="TikPlay">
      <span class="brand-mark"><span></span></span>
      <span class="brand-name">Tik<span>Play</span></span>
    </a>
    <header class="tp-auth-heading">
      <div class="eyebrow"><i></i> PAINEL DO CRIADOR</div>
      <h1 id="authTitle">Bem-vindo ao <span>TikPlay.</span></h1>
      <p id="authSubtitle">Entre na sua conta para continuar.</p>
    </header>

      <div class="tp-auth-alert" id="alertBox" role="alert" aria-live="assertive"></div>

      <div class="tp-auth-tabs" role="tablist" aria-label="Acesso à conta">
        <button type="button" id="tabLogin" class="active" role="tab" aria-selected="true" aria-controls="formLogin" onclick="switchTab('login')">Entrar</button>
        <button type="button" id="tabRegister" role="tab" aria-selected="false" aria-controls="formRegister" onclick="switchTab('register')">Criar conta</button>
      </div>

      <form id="formLogin" class="tp-auth-form" role="tabpanel" aria-labelledby="tabLogin" onsubmit="doLogin(event)">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="loginEmail" required autocomplete="email">
        </div>
        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input type="password" class="form-control" id="loginPassword" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-nb">Entrar</button>
      </form>

      <form id="formRegister" class="tp-auth-form" role="tabpanel" aria-labelledby="tabRegister" style="display:none" onsubmit="doRegister(event)">
        <div class="tp-auth-alert err" id="regGateMsg" style="display:none" role="status" aria-live="polite"></div>
        <input type="hidden" id="regInviteToken" value="">
        <div class="mb-3">
          <label class="form-label">Nome</label>
          <input type="text" class="form-control" id="regName">
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="regEmail" required autocomplete="email">
        </div>
        <div class="mb-3">
          <label class="form-label">Senha (min. 8)</label>
          <input type="password" class="form-control" id="regPassword" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-nb">Criar Conta</button>
      </form>
  </section>
</main>

<script>
function showAlert(msg, ok) {
  const box = document.getElementById("alertBox");
  box.className = "tp-auth-alert " + (ok ? "ok" : "err");
  box.textContent = msg;
}

function switchTab(tab) {
  document.getElementById("tabLogin").classList.toggle("active", tab === "login");
  document.getElementById("tabRegister").classList.toggle("active", tab === "register");
  document.getElementById("tabLogin").setAttribute("aria-selected", String(tab === "login"));
  document.getElementById("tabRegister").setAttribute("aria-selected", String(tab === "register"));
  document.getElementById("formLogin").style.display = tab === "login" ? "" : "none";
  document.getElementById("formRegister").style.display = tab === "register" ? "" : "none";
  document.getElementById("authSubtitle").textContent = tab === "register"
    ? "Crie sua conta para continuar."
    : "Entre na sua conta para continuar.";
  if (tab === "register") renderRegisterGate();
}

// ---- Cadastro por convite (REGISTER_MODE) ----
const regParams = new URLSearchParams(location.search);
const inviteToken = regParams.get("invite") || "";
let registerMode = "public";
let inviteValid = false;

const REGISTER_INVITE_MSG = "O cadastro na TikPlay está disponível apenas por convite durante o período de testes.";
const REGISTER_CLOSED_MSG = "Cadastro indisponível no momento.";

async function checkRegisterMode() {
  try {
    const r = await fetch("/api/auth/register-mode");
    const data = await r.json();
    registerMode = data.mode || "public";
  } catch { registerMode = "public"; }
}

async function validateInvite() {
  if (registerMode !== "invite" || !inviteToken) return;
  try {
    const r = await fetch("/api/auth/invite/" + encodeURIComponent(inviteToken));
    const data = await r.json();
    if (data.valid) {
      inviteValid = true;
      document.getElementById("regInviteToken").value = inviteToken;
    }
  } catch {}
}

function renderRegisterGate() {
  const msg = document.getElementById("regGateMsg");
  const form = document.getElementById("formRegister");
  const btn = form ? form.querySelector("button[type=submit]") : null;
  const tabRegister = document.getElementById("tabRegister");
  if (!msg || !form || !tabRegister) return;

  if (registerMode === "public") {
    tabRegister.style.display = "";
    tabRegister.disabled = false;
    msg.style.display = "none";
    if (btn) btn.disabled = false;
    return;
  }
  if (registerMode === "closed") {
    tabRegister.style.display = "none";
    return;
  }
  // invite
  if (!inviteToken) {
    tabRegister.style.display = "none";
    return;
  }
  if (!inviteValid) {
    tabRegister.style.display = "";
    tabRegister.disabled = false;
    msg.textContent = "Este convite já foi utilizado ou expirou.";
    msg.style.display = "block";
    if (btn) btn.disabled = true;
    return;
  }
  tabRegister.style.display = "";
  tabRegister.disabled = false;
  msg.style.display = "none";
  if (btn) btn.disabled = false;
}

async function doLogin(e) {
  e.preventDefault();
  const res = await fetch("/api/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      email: document.getElementById("loginEmail").value,
      password: document.getElementById("loginPassword").value,
    }),
  });
  const data = await res.json();
  if (data.success) {
    localStorage.setItem("token", data.token);
    localStorage.setItem("user", JSON.stringify(data.user));
    location.href = "/painel";
  } else {
    showAlert(data.error || "Falha no login", false);
  }
}

async function doRegister(e) {
  e.preventDefault();
  const res = await fetch("/api/auth/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      name: document.getElementById("regName").value,
      email: document.getElementById("regEmail").value,
      password: document.getElementById("regPassword").value,
      inviteToken: document.getElementById("regInviteToken").value,
    }),
  });
  const data = await res.json();
  if (data.success) {
    showAlert("Conta criada! Entrando...", true);
    localStorage.setItem("token", data.token);
    localStorage.setItem("user", JSON.stringify(data.user));
    setTimeout(() => { location.href = "/painel"; }, 600);
  } else {
    showAlert(data.error || "Falha no cadastro", false);
  }
}

if (localStorage.getItem("token")) location.href = "/painel";

(async () => {
  await checkRegisterMode();
  await validateInvite();
  renderRegisterGate();
  if (["/register", "/cadastro"].includes(location.pathname) && document.getElementById("tabRegister").style.display !== "none") {
    switchTab("register");
  }
})();
</script>
</body>
</html>
