<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>TikPlay · Subida de nível</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="overlay.css?v=20261014-22">
</head>
<body>
  <main class="overlay-stage" id="stage">
    <div class="overlay-master" id="overlayMaster">
    <section class="level-overlay" id="overlay" data-phase="idle" aria-live="polite">
      <div class="ambient ambient-a"></div>
      <div class="ambient ambient-b"></div>
      <div class="grain"></div>
      <div class="beam beam-a"></div>
      <div class="beam beam-b"></div>

      <header class="profile-header">
        <div class="profile">
          <div class="avatar-shell">
            <img id="avatar" class="avatar" alt="">
            <div id="avatarFallback" class="avatar-fallback">TP</div>
          </div>
          <div class="profile-info">
            <div class="name-row">
              <strong id="username">PEU</strong>
              <span class="spark-emoji">✦</span>
            </div>
            <p class="announcement" id="announcement"></p>
            <div class="presenter-level-pill">
              <span id="miniCurrent" class="pill-gem"></span>
              <b id="currentLevel">24</b>
            </div>
          </div>
        </div>

        <div class="event-badge"><i></i><span id="eventBadgeLabel">SUBIDA DE NÍVEL</span></div>
      </header>

      <div class="tier-track" id="tierTrack">
        <div class="track-rail"></div>
        <div class="track-progress" id="trackProgress"></div>
        <div class="tier-node" data-tier="1"><span class="node-gem" id="node1"></span><i></i></div>
        <div class="tier-node" data-tier="2"><span class="node-gem" id="node2"></span><i></i></div>
        <div class="tier-node" data-tier="3"><span class="node-gem" id="node3"></span><i></i></div>
        <div class="tier-node" data-tier="4"><span class="node-gem" id="node4"></span><i></i></div>
        <div class="tier-node" data-tier="5"><span class="node-gem" id="node5"></span><i></i></div>
        <div class="tier-node" data-tier="6"><span class="node-gem" id="node6"></span><i></i></div>
      </div>

      <section class="tier-card" id="tierCard">
        <div class="card-glow"></div>

        <div class="tier-copy">
          <div class="tier-title-row">
            <div class="roman-wrap">
              <span class="laurel left">❮</span>
              <strong id="roman">III</strong>
              <span class="laurel right">❯</span>
            </div>
              <span class="range-label" id="rangeLabel">Nível 20–29</span>
          </div>

          <div class="level-change" id="levelChange">
            <span id="fromLabel">NÍVEL</span>
            <b id="fromLevel">23</b>
            <span id="toLabel">→ NÍVEL</span>
            <b id="toLevel">24</b>
          </div>

          <div class="progress-block" id="progressBlock">
            <div class="progress-numbers"><b id="progressValue">136963</b><span>/</span><span id="progressGoal">144000</span></div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div><i class="progress-shine"></i></div>
          </div>

          <p id="message">Parabéns por atingir este nível!</p>
        </div>

        <div class="gem-stage">
          <div class="gem-radiance"></div>
          <div class="gem-old" id="gemOld"></div>
          <div class="gem-new" id="gemNew"></div>
          <div class="gem-particles" aria-hidden="true">
            <i class="p1"></i><i class="p2"></i><i class="p3"></i><i class="p4"></i><i class="p5"></i><i class="p6"></i>
          </div>
        </div>

        <div class="corner-light"></div>
      </section>

      <footer class="footer-note">
        <span class="footer-chip" id="footerChip">PRESENTEADOR</span>
        <span id="footerText">Seu emblema evoluiu.</span>
      </footer>
    </section>
    </div>
  </main>

  <script src="overlay.js?v=20261014-21"></script>
</body>
</html>
