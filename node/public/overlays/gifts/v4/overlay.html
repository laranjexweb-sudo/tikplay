<!doctype html>
<html lang="pt-BR" class="overlay-document">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TikPlay · Ranking vertical de diamantes</title>
  <style>
    :root { color-scheme:dark; font-family:Inter,"Segoe UI",Arial,sans-serif; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; min-height:100%; margin:0; overflow:hidden; background:transparent!important; }
    body.overlay { position:relative; width:100%; max-width:none; min-height:100vh; }
    .gift-position { position:absolute; left:0; top:0; width:min(941px,100vw); aspect-ratio:941/1672; container-type:inline-size; transform-origin:top left; }
    .portrait { position:absolute; z-index:1; display:grid; place-items:center; overflow:hidden; border-radius:50%; background:linear-gradient(145deg,#3c195f,#152047); box-shadow:0 0 12px #08d8ff77; color:#f6d7ff; font-weight:900; }
    .portrait[hidden],.slot[hidden] { display:none; }
    .portrait img { width:100%; height:100%; object-fit:cover; }
    .art { position:absolute; z-index:2; inset:0; width:100%; height:100%; object-fit:fill; pointer-events:none; user-select:none; }
    .slot { position:absolute; z-index:3; display:flex; align-items:center; justify-content:center; min-width:0; overflow:hidden; color:#fff; text-align:center; text-shadow:0 2px 5px #050014,0 0 9px #050014; }
    .slot .info { display:block; width:100%; min-width:0; overflow:hidden; }
    .slot .name { display:block; max-width:100%; overflow:hidden; font-weight:900; line-height:1.1; text-overflow:ellipsis; white-space:nowrap; }
    .slot .score { display:block; max-width:100%; margin-top:4px; overflow:hidden; color:#ffe779; font-weight:800; line-height:1; text-overflow:ellipsis; white-space:nowrap; }
    .slot .coin { position:relative; display:inline-block; width:.92em; height:.92em; margin-right:.25em; border:1.5px solid #fff0a6; border-radius:50%; background:radial-gradient(circle at 32% 28%,#fff6be 0 12%,#ffd94f 30%,#e99c16 72%,#a95708 100%); box-shadow:0 0 3px #ffcf39a8,inset 0 0 0 1px #b76c18; vertical-align:-.08em; }
    .slot .coin::after { position:absolute; inset:20%; border:1px solid #a85c0d; border-radius:50%; content:""; }
    .slot.one .name,.slot.two .name { font-size:clamp(22px,3.1cqw,31px); }
    .slot.one .score,.slot.two .score { font-size:clamp(14px,2.7vw,20px); }
    .slot.three .name,.slot.four .name,.slot.five .name,.slot.six .name { font-size:clamp(20px,2.7cqw,26px); }
    .slot.three .score,.slot.four .score,.slot.five .score,.slot.six .score { margin-top:3px; font-size:clamp(13px,2.3vw,18px); }
    /* Coordenadas validadas na prévia vertical 941 × 1672. */
    .portrait.one { left:19.1%; top:7.4%; width:23%; aspect-ratio:1; font-size:24px; }
    .portrait.two { left:calc(19.1% + 1px); top:34.5%; width:20.5%; aspect-ratio:1; font-size:23px; }
    .portrait.three { left:12%; top:56.4%; width:18%; aspect-ratio:1; font-size:17px; }
    .portrait.four { left:13%; top:70.2%; width:13%; aspect-ratio:1; font-size:15px; }
    .portrait.five { left:13%; top:79%; width:13%; aspect-ratio:1; font-size:17px; }
    .portrait.six { left:13%; top:88.2%; width:13%; aspect-ratio:1; font-size:17px; }
    .slot.one { left:14.8%; top:25.1%; width:33%; height:4.1%; }
    .slot.two { left:16%; top:calc(49.5% - 4px); width:30%; height:4.1%; }
    .slot.three { left:34.6%; top:61.5%; width:21%; height:3.7%; text-align:left; }
    .slot.four { left:29%; top:72.3%; width:20.2%; height:3.6%; text-align:left; }
    .slot.four .score { margin-bottom:4px; }
    .slot.five { left:29%; top:81.3%; width:20.2%; height:3.6%; text-align:left; }
    .slot.five .score { margin-bottom:4px; }
    .slot.six { left:29%; top:90.1%; width:20.2%; height:3.6%; text-align:left; }
    .slot.six .score { margin-bottom:4px; }
    body.demo-preview .gift-position { position:relative; left:auto; top:auto; width:min(100vw,calc(100vh * 941 / 1672)); margin:auto; transform:none; }
    body.demo-preview .portrait.one { font-size:clamp(12px,6vw,24px); }
    body.demo-preview .portrait.two { font-size:clamp(12px,5.7vw,23px); }
    body.demo-preview .portrait.three,body.demo-preview .portrait.four,body.demo-preview .portrait.five,body.demo-preview .portrait.six { font-size:clamp(9px,4.2vw,17px); }
    body.demo-preview .slot.one .name,body.demo-preview .slot.two .name { font-size:clamp(9px,3vw,14px); }
    body.demo-preview .slot.one .score,body.demo-preview .slot.two .score { font-size:clamp(8px,2.3vw,11px); }
    body.demo-preview .slot.three .name,body.demo-preview .slot.four .name,body.demo-preview .slot.five .name,body.demo-preview .slot.six .name { font-size:clamp(8px,2.2vw,11px); }
    body.demo-preview .slot.three .score,body.demo-preview .slot.four .score,body.demo-preview .slot.five .score,body.demo-preview .slot.six .score { font-size:clamp(7px,1.8vw,9px); }
    body.art-only-preview .portrait,body.art-only-preview .slot { display:none!important; }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
  </style>
</head>
<body class="overlay">
  <div class="gift-position" data-gift-position>
    <div class="portrait one" data-portrait="0"></div>
    <div class="portrait two" data-portrait="1"></div>
    <div class="portrait three" data-portrait="2"></div>
    <div class="portrait four" data-portrait="3"></div>
    <div class="portrait five" data-portrait="4"></div>
    <div class="portrait six" data-portrait="5"></div>
    <img class="art" src="assets/overleyvertical.png" alt="Moldura vertical do ranking com seis posições">
    <div class="slot one" data-slot="0"></div>
    <div class="slot two" data-slot="1"></div>
    <div class="slot three" data-slot="2"></div>
    <div class="slot four" data-slot="3"></div>
    <div class="slot five" data-slot="4"></div>
    <div class="slot six" data-slot="5"></div>
  </div>
  <script src="ranking.js?v=gift-ranking-v4-vertical-6-9"></script>
</body>
</html>
