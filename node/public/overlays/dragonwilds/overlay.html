<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ranking de Diamantes e Curtidas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --panel-dark: rgba(12, 8, 6, 0.88);
      --panel-dark-2: rgba(22, 14, 10, 0.95);
      --text-main: #fff3df;
      --text-soft: #d8b88d;
      --line-soft: rgba(255, 210, 120, 0.12);

      /* coins */
      --coin-main: #f4c770;
      --coin-2: #ff9c3a;
      --coin-3: #a14d12;

      /* likes */
      --like-main: #ff8db1;
      --like-2: #ff5d88;
      --like-3: #a52a55;

      --shadow: rgba(0, 0, 0, 0.45);
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      background-color: rgba(0, 0, 0, 0) !important;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }

    .overlay-stage {
      width: 100%;
      height: 100%;
      position: relative;
      padding: 0;
    }

    .ranking-stack {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .ranking-card {
      position: absolute;
      left: 0;
      top: 0;
      width: 420px;
      max-width: calc(100vw - 24px);
      transform-origin: top left;
      border-radius: 0;
      padding: 0;
      overflow: visible;
      background: transparent;
      box-shadow: none;
    }

    .ranking-card.coins {
      background: transparent;
    }

    .ranking-card.likes {
      background: transparent;
      box-shadow: none;
    }

    .ranking-inner {
      position: relative;
      border-radius: 0;
      padding: 20px 18px 16px;
      overflow: visible;
      background: transparent;
      backdrop-filter: none;
    }

    .ranking-inner::before {
      content: none;
    }

    .ranking-inner::after {
      content: none;
    }

    .coins .ranking-inner::after {
      background: radial-gradient(circle, rgba(255, 168, 70, 0.15), transparent 60%);
    }

    .likes .ranking-inner::after {
      background: radial-gradient(circle, rgba(255, 110, 160, 0.14), transparent 60%);
    }

    .header {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .coins .eyebrow {
      color: #ffbf67;
    }

    .likes .eyebrow {
      color: #ff9cbc;
    }

    .title {
      font-family: 'Cinzel', serif;
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 1px;
    }

    .coins .title {
      color: var(--coin-main);
      font-size: 22px;
      white-space: nowrap;
      text-shadow: 0 0 10px rgba(255, 170, 72, 0.12);
    }

    .likes .title {
      color: var(--like-main);
      text-shadow: 0 0 10px rgba(255, 93, 136, 0.15);
    }

    .header-badge {
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      border: 1px solid;
      background: rgba(255,255,255,0.04);
      white-space: nowrap;
    }

    .coins .header-badge {
      color: var(--coin-main);
      border-color: rgba(255, 197, 107, 0.24);
    }

    .likes .header-badge {
      color: var(--like-main);
      border-color: rgba(255, 141, 177, 0.24);
    }

    .top-three {
      position: relative;
      z-index: 2;
      display: grid;
      gap: 52px;
      margin-bottom: 14px;
    }

    .top-item {
      --top-row-height: 64px;
      --top-frame-size: 108px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      border-radius: 15px;
      height: var(--top-row-height);
      padding: 6px 11px 6px calc(var(--top-frame-size) + 8px);
      border: 1px solid transparent;
      background: transparent;
    }

    .coins .top-three .top-item {
      --podium-edge: rgba(255, 199, 112, 0.95);
      --podium-glow: rgba(255, 166, 52, 0.3);
    }

    .likes .top-three .top-item {
      --podium-edge: rgba(255, 141, 177, 0.95);
      --podium-glow: rgba(255, 79, 139, 0.3);
    }

    .top-three .top-item {
      --enter-delay: 0ms;
      --reflection-from: 130%;
      --reflection-to: -130%;
      position: relative;
      isolation: isolate;
      overflow: visible;
      transition: border-color 220ms ease, box-shadow 220ms ease;
      animation: podium-enter 620ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
    }

    .top-three .top-item::before {
      border-radius: 13px;
    }

    .top-three .top-item.is-reflecting {
      border-color: transparent;
      box-shadow: none;
    }

    .top-three .top-item > * {
      position: relative;
      z-index: 2;
    }

    .top-three .top-item::before,
    .top-three .top-item::after {
      content: "";
      position: absolute;
      pointer-events: none;
      opacity: 0;
    }

    .top-three .top-item::before {
      inset: 1px;
      z-index: 1;
      border-radius: 13px;
      background: linear-gradient(
        112deg,
        transparent 35%,
        rgba(255,255,255,0.22) 45%,
        rgba(255,255,255,0.62) 50%,
        rgba(255,255,255,0.24) 55%,
        transparent 65%
      );
      background-size: 260% 100%;
      background-position: var(--reflection-from) 0;
      clip-path: inset(0 0 0 calc(var(--top-frame-size) + 8px) round 0 13px 13px 0);
    }

    .top-three .top-item::after {
      content: none;
    }

    .top-three .top-item.is-reflecting::before {
      animation: surface-reflection 1.6s ease-in-out both;
    }

    .top-three .top-item.is-reflecting::after {
      animation: border-reflection 1.6s ease-in-out both;
    }

    .top-three .top-item:nth-child(2) {
      --enter-delay: 100ms;
    }

    .top-three .top-item:nth-child(3) {
      --enter-delay: 200ms;
    }

    @keyframes podium-enter {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.985);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes surface-reflection {
      0% { opacity: 0; background-position: var(--reflection-from) 0; }
      18% { opacity: 1; }
      78% { opacity: 0.8; background-position: var(--reflection-to) 0; }
      100% { opacity: 0; background-position: var(--reflection-to) 0; }
    }

    @keyframes border-reflection {
      0% { opacity: 0; background-position: var(--reflection-from) 0; }
      16% { opacity: 1; }
      72% { opacity: 0.95; background-position: var(--reflection-to) 0; }
      100% { opacity: 0; background-position: var(--reflection-to) 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .top-three .top-item,
      .coins .top-three .top-item.top1,
      .likes .top-three .top-item.top1 {
        animation: none;
      }

      .top-three .top-item.is-reflecting::before,
      .top-three .top-item.is-reflecting::after {
        animation: none;
        opacity: 0;
      }

      .top-three .top-item.is-reflecting {
        border-color: rgba(255,255,255,0.06);
        box-shadow: none;
      }
    }

    .player {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .top-three .player {
      display: contents;
    }

    .rank-frame {
      position: absolute;
      z-index: 4;
      left: 0;
      top: 50%;
      display: block;
      flex: 0 0 108px;
      width: 108px;
      height: 108px;
      transform: translateY(-50%);
    }

    .rank-frame .avatar {
      position: absolute;
      z-index: 1;
      left: 50%;
      top: 43.1%;
      width: 68px;
      height: 68px;
      flex-basis: 68px;
      border: 0;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: rgba(12, 8, 6, 0.86);
    }

    .rank-frame[data-place="2"] .avatar {
      top: 45.1%;
      width: 72px;
      height: 72px;
      flex-basis: 72px;
    }

    .rank-frame[data-place="3"] .avatar {
      top: 45.5%;
      width: 72px;
      height: 72px;
      flex-basis: 72px;
    }

    .rank-frame-art {
      position: absolute;
      z-index: 2;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .avatar {
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 50%;
      object-fit: cover;
      background: #18212d;
    }

    .avatar-fallback {
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
    }

    .player-copy {
      min-width: 0;
    }

    .player-name {
      color: var(--text-main);
      font-size: 17px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-sub {
      margin-top: 4px;
      color: var(--text-soft);
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .value-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }

    .value {
      font-family: 'Cinzel', serif;
      font-size: 22px;
      font-weight: 800;
      line-height: 1;
    }

    .coins .value {
      color: var(--coin-main);
    }

    .likes .value {
      color: var(--like-main);
    }

    .label-small {
      color: var(--text-soft);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .divider {
      position: relative;
      z-index: 2;
      height: 1px;
      margin: 14px 0 12px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.18),
        transparent
      );
    }

    .list {
      position: relative;
      z-index: 2;
      display: grid;
      gap: 7px;
    }

    .row {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      border-radius: 13px;
      padding: 9px 11px;
      background: rgba(10,12,16,0.82);
      border: 1px solid rgba(255,255,255,0.10);
    }

    .row-rank {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', serif;
      font-size: 15px;
      font-weight: 800;
    }

    .coins .row-rank {
      color: var(--coin-main);
      background: linear-gradient(180deg, rgba(255, 193, 97, 0.16), rgba(111, 48, 14, 0.32));
    }

    .likes .row-rank {
      color: var(--like-main);
      background: linear-gradient(180deg, rgba(255, 146, 183, 0.16), rgba(101, 23, 53, 0.34));
    }

    .row-name {
      color: var(--text-main);
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-profile {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .row-profile .avatar {
      flex-basis: 32px;
      width: 32px;
      height: 32px;
    }

    .row-profile-copy {
      min-width: 0;
    }

    .row-handle {
      margin-top: 2px;
      color: var(--text-soft);
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-score {
      font-size: 14px;
      font-weight: 800;
    }

    .coins .row-score {
      color: #ffc979;
    }

    .likes .row-score {
      color: #ff9cbc;
    }

    .footer {
      position: relative;
      z-index: 2;
      margin-top: 13px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--text-soft);
      font-size: 12px;
      font-weight: 600;
    }

    .bottom-line {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 0;
      height: 3px;
      border-radius: 999px;
    }

    .coins .bottom-line {
      background:
        linear-gradient(
          90deg,
          rgba(255, 170, 72, 0),
          rgba(255, 157, 42, 1),
          rgba(255, 209, 120, 0.85),
          rgba(255, 170, 72, 0)
        );
      box-shadow:
        0 0 10px rgba(255, 150, 52, 0.35),
        0 0 24px rgba(255, 150, 52, 0.16);
    }

    .likes .bottom-line {
      background:
        linear-gradient(
          90deg,
          rgba(255, 93, 136, 0),
          rgba(255, 93, 136, 1),
          rgba(255, 170, 200, 0.90),
          rgba(255, 93, 136, 0)
        );
      box-shadow:
        0 0 10px rgba(255, 93, 136, 0.35),
        0 0 24px rgba(255, 93, 136, 0.18);
    }

    @media (max-width: 900px) {
      .ranking-card { width: min(420px, calc(100vw - 24px)); }
      .title {
        font-size: 24px;
      }

      .coins .title {
        font-size: 16px;
      }

      .player-name {
        font-size: 15px;
      }

      .value {
        font-size: 20px;
      }
    }

    .ranking-card[data-hidden="true"] { display: none; }
    body.preview-background { background: transparent; }
    body.preview-background .ranking-inner { padding: 12px 12px 8px; }
    body.preview-background .top-three { gap: 40px; margin-bottom: 8px; }
    body.preview-background .top-item { --top-row-height: 48px; --top-frame-size: 82px; grid-template-columns: minmax(0,1fr) auto; gap: 4px; padding: 4px 6px 4px 90px; }
    body.preview-background .rank-frame { left: 0; width: 82px; height: 82px; }
    body.preview-background .rank-frame .avatar { width: 54px; height: 54px; flex-basis: 54px; }
    body.preview-background .rank-frame[data-place="2"] .avatar,
    body.preview-background .rank-frame[data-place="3"] .avatar { width: 58px; height: 58px; flex-basis: 58px; }
    body.preview-background .player { gap: 4px; }
    body.preview-background .player-name { font-size: 13px; }
    body.preview-background .player-sub { margin-top: 2px; font-size: 9px; }
    body.preview-background .value { font-size: 17px; }
    body.preview-background .label-small { font-size: 9px; }
    body.preview-background .divider { margin: 7px 0 6px; }
    body.preview-background .list { gap: 4px; }
    body.preview-background .row { grid-template-columns: 25px minmax(0,1fr) auto; gap: 6px; padding: 5px 7px; }
    body.preview-background .row-rank { width: 25px; height: 25px; font-size: 12px; }
    body.preview-background .row-profile { gap: 5px; }
    body.preview-background .row-profile .avatar { flex-basis: 23px; width: 23px; height: 23px; }
    body.preview-background .row-name { font-size: 12px; }
    body.preview-background .row-handle { font-size: 8px; }
    body.preview-background .row-score { font-size: 12px; }
  </style>
</head>
<body>

  <div class="overlay-stage">

    <div class="ranking-stack">

      <!-- RANKING DE COINS -->
      <div class="ranking-card coins" data-ranking="coins" aria-label="Ranking de diamantes">
        <div class="ranking-inner">
          <div class="top-three" data-ranking-top="coins"></div>
          <div class="divider"></div>
          <div class="list" data-ranking-list="coins"></div>
        </div>
      </div>

      <!-- RANKING DE CURTIDAS -->
      <div class="ranking-card likes" data-ranking="likes" aria-label="Ranking de curtidas">
        <div class="ranking-inner">
          <div class="top-three" data-ranking-top="likes"></div>
          <div class="divider"></div>
          <div class="list" data-ranking-list="likes"></div>
        </div>
      </div>

    </div>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('tk') || params.get('token');
    const demo = params.get('demo') === '1' || params.has('preview');
    const previewOnly = params.get('only');
    const visibleCount = params.get('demo') === '1' ? 4 : 6;
    const state = { roomId: '', likes: [], coins: [], socket: null, closing: false, coinRefreshTimer: 0 };
    const defaultLayouts = { coins: { x: 5, y: 5, scale: 1 }, likes: { x: 52, y: 5, scale: 1 } };
    const layouts = Object.fromEntries(Object.entries(defaultLayouts).map(([key, layout]) => [key, {
      x: clamp(params.get(`${key}X`), 0, 100, layout.x),
      y: clamp(params.get(`${key}Y`), 0, 100, layout.y),
      scale: clamp(params.get(`${key}Scale`), 0.5, 2, layout.scale),
    }]));
    if (layouts.coins.x === 5 && layouts.coins.y === 5 && layouts.likes.x === 5 && layouts.likes.y === 52) {
      layouts.likes = { ...layouts.likes, ...defaultLayouts.likes };
    }
    const rankingCards = Object.fromEntries(['coins', 'likes'].map(type => [type, document.querySelector(`[data-ranking="${type}"]`)]));
    const number = value => Math.max(0, Number(value) || 0).toLocaleString('pt-BR');

    function clamp(value, min, max, fallback) {
      if (value === null || value === undefined || value === '') return fallback;
      const parsed = Number(value);
      return Number.isFinite(parsed) ? Math.min(max, Math.max(min, parsed)) : fallback;
    }

    function setLayouts(next) {
      for (const type of ['coins', 'likes']) {
        const card = rankingCards[type];
        const layout = next?.[type];
        if (!card || !layout) continue;
        const x = clamp(layout.x, 0, 100, defaultLayouts[type].x);
        const y = clamp(layout.y, 0, 100, defaultLayouts[type].y);
        let scale = clamp(layout.scale, 0.5, 2, defaultLayouts[type].scale);
        if (demo && card.dataset.hidden !== 'true' && card.offsetWidth && card.offsetHeight) {
          const left = window.innerWidth * x / 100;
          const top = window.innerHeight * y / 100;
          const fit = Math.min(1, (window.innerWidth - left - 8) / card.offsetWidth, (window.innerHeight - top - 8) / card.offsetHeight);
          scale *= Math.max(0.1, fit);
        }
        card.style.left = `${x}%`;
        card.style.top = `${y}%`;
        card.style.transform = `scale(${scale})`;
      }
      if (previewOnly === 'coins' || previewOnly === 'likes') {
        for (const type of ['coins', 'likes']) rankingCards[type].dataset.hidden = String(type !== previewOnly);
      }
    }

    function makeAvatar(item) {
      const name = item.nickname || item.username || item.user || '?';
      const avatar = String(item.avatar || '').trim();
      if (avatar) {
        try {
          const url = new URL(avatar, location.origin);
          if (url.protocol === 'https:' || url.origin === location.origin) {
            const image = new Image();
            image.className = 'avatar';
            image.alt = '';
            image.src = url.href;
            image.onerror = () => image.replaceWith(makeFallback(name));
            return image;
          }
        } catch {}
      }
      return makeFallback(name);
    }

    function makeFallback(name) {
      const node = document.createElement('span');
      node.className = 'avatar avatar-fallback';
      node.textContent = String(name || '?').trim().slice(0, 1).toUpperCase();
      return node;
    }

    function createProfile(item, compact = false, framedPlace = 0) {
      const profile = document.createElement('div');
      profile.className = compact ? 'row-profile' : 'player';
      const avatar = makeAvatar(item);
      if (framedPlace >= 1 && framedPlace <= 3) {
        const frame = document.createElement('span');
        frame.className = 'rank-frame';
        frame.dataset.place = String(framedPlace);
        frame.setAttribute('aria-hidden', 'true');
        const frameArt = new Image();
        frameArt.className = 'rank-frame-art';
        frameArt.alt = '';
        frameArt.src = `/overlays/dragonwilds/assets/${String(framedPlace).padStart(2, '0')}-ranking.png`;
        frame.append(avatar, frameArt);
        profile.append(frame);
      } else {
        profile.append(avatar);
      }
      const copy = document.createElement('div');
      copy.className = compact ? 'row-profile-copy' : 'player-copy';
      const name = document.createElement('div');
      name.className = compact ? 'row-name' : 'player-name';
      name.textContent = item.nickname || item.display_name || item.username || item.user || 'Participante';
      name.title = name.textContent;
      const handle = document.createElement('div');
      handle.className = compact ? 'row-handle' : 'player-sub';
      const username = String(item.username || item.unique_id || item.uniqueId || item.user || item.user_id || '').replace(/^@/, '');
      handle.textContent = username ? `@${username}` : '@TikTok';
      handle.title = handle.textContent;
      copy.append(name, handle);
      profile.append(copy);
      return profile;
    }

    function createRankRow(type, item, index, compact = false) {
      const row = document.createElement('div');
      const topThree = !compact;
      row.className = topThree ? `top-item${index === 0 ? ' top1' : ''}` : 'row';
      const valueBox = document.createElement('div');
      valueBox.className = topThree ? 'value-box' : 'row-score';
      const amount = type === 'coins' ? item.value_sum : item.likes;
      if (topThree) {
        const value = document.createElement('div');
        value.className = 'value';
        value.textContent = number(amount);
        const label = document.createElement('div');
        label.className = 'label-small';
        label.textContent = type === 'coins' ? 'diamantes' : 'curtidas';
        valueBox.append(value, label);
      } else {
        valueBox.textContent = number(amount);
      }
      if (compact) {
        const rank = document.createElement('div');
        rank.className = 'row-rank';
        rank.textContent = String(index + 4);
        row.append(rank, createProfile(item, true), valueBox);
      } else {
        row.append(createProfile(item, false, index + 1), valueBox);
      }
      return row;
    }

    function render(type, source) {
      const card = rankingCards[type];
      if (!card) return;
      const items = (Array.isArray(source) ? source : []).slice(0, demo ? visibleCount : 10);
      const podium = card.querySelector('[data-ranking-top]');
      const list = card.querySelector('[data-ranking-list]');
      podium.replaceChildren();
      list.replaceChildren();
      items.slice(0, 3).forEach((item, index) => podium.append(createRankRow(type, item, index)));
      items.slice(3).forEach((item, index) => list.append(createRankRow(type, item, index, true)));
      if (!items.length) {
        const empty = document.createElement('div');
        empty.className = 'row-name';
        empty.textContent = demo ? 'Prévia' : 'Aguardando atividade';
        list.append(empty);
      }
    }

    async function api(path) {
      const response = await fetch(path, { headers: { Authorization: `Bearer ${token}` }, cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }

    async function loadCoinRanking(roomId) {
      if (!roomId || !token) { state.coins = []; render('coins', []); return; }
      const query = new URLSearchParams({ room_id: roomId, type: 'gift', limit: String(visibleCount) });
      const eventsQuery = new URLSearchParams({ room_id: roomId, type: 'gift', limit: '200' });
      const [rankingData, eventData] = await Promise.all([
        api(`/api/reports/ranking?${query}`),
        api(`/api/reports/events?${eventsQuery}`),
      ]);
      const identityByUser = new Map();
      for (const event of eventData.events || []) {
        identityByUser.set(String(event.user_id), event);
        if (event.username) identityByUser.set(String(event.username).toLowerCase(), event);
      }
      state.coins = (rankingData.ranking || []).map(entry => {
        const identity = identityByUser.get(String(entry.user_id)) || {};
        return { ...identity, user_id: entry.user_id, username: identity.username || identity.user || entry.user_id, value_sum: entry.value_sum };
      });
      render('coins', state.coins);
    }

    async function loadSnapshot() {
      if (!token) return;
      try {
        const snapshot = await api('/api/game-state');
        const nextRoom = String(snapshot.last_status?.room_id || state.roomId || '');
        if (nextRoom !== state.roomId) state.likes = [];
        state.roomId = nextRoom;
        state.likes = snapshot.likes_ranking_all || snapshot.likes_ranking || [];
        render('likes', state.likes);
        await loadCoinRanking(state.roomId);
      } catch {}
    }

    function connect() {
      if (!token || state.closing) return;
      const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
      const socket = new WebSocket(`${protocol}://${location.host}/browser?token=${encodeURIComponent(token)}`);
      state.socket = socket;
      socket.onopen = loadSnapshot;
      socket.onmessage = event => {
        try {
          const message = JSON.parse(event.data);
          if (message.type === 'status') {
            const nextRoom = String(message.room_id || '');
            if (nextRoom !== state.roomId) {
              state.roomId = nextRoom;
              state.likes = [];
              render('likes', []);
              state.coins = [];
              render('coins', []);
              loadCoinRanking(state.roomId).catch(() => {});
            }
          } else if (message.type === 'likes_ranking') {
            state.likes = message.ranking_all || message.likes_ranking_all || message.ranking || [];
            render('likes', state.likes);
          } else if (message.type === 'gift_event') {
            clearTimeout(state.coinRefreshTimer);
            state.coinRefreshTimer = setTimeout(() => loadCoinRanking(state.roomId).catch(() => {}), 650);
          }
        } catch {}
      };
      socket.onclose = event => {
        if (event.code !== 1008 && !state.closing) setTimeout(connect, 3000);
      };
    }

    function startPodiumReflections() {
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let sequence = [];
      let lastItem = null;
      function scheduleNext() {
        const items = Array.from(document.querySelectorAll('.top-three .top-item'));
        if (reducedMotion.matches || items.length < 2) return;
        if (!sequence.length || sequence.some(item => !item.isConnected)) {
          sequence = items.slice();
          for (let i = sequence.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [sequence[i], sequence[j]] = [sequence[j], sequence[i]];
          }
          if (sequence[0] === lastItem) [sequence[0], sequence[1]] = [sequence[1], sequence[0]];
        }
        const item = sequence.shift();
        const reverse = Math.random() < 0.5;
        item.style.setProperty('--reflection-from', reverse ? '-130%' : '130%');
        item.style.setProperty('--reflection-to', reverse ? '130%' : '-130%');
        item.classList.add('is-reflecting');
        lastItem = item;
        window.setTimeout(() => {
          item.classList.remove('is-reflecting');
          item.style.removeProperty('--reflection-from');
          item.style.removeProperty('--reflection-to');
          window.setTimeout(scheduleNext, 350 + Math.random() * 650);
        }, 1600);
      }
      window.setTimeout(scheduleNext, 400);
    }

    window.addEventListener('message', event => {
      if (event.origin !== location.origin || event.data?.type !== 'dragonwilds-layout') return;
      setLayouts(event.data.layouts);
    });
    window.addEventListener('pagehide', () => {
      state.closing = true;
      clearTimeout(state.coinRefreshTimer);
      state.socket?.close();
    }, { once: true });

    setLayouts(layouts);
    if (demo) {
      document.body.classList.add('preview-background');
      render('coins', [
        { nickname: 'DragonMasterBR', username: 'dragonmasterbr', value_sum: 25400 },
        { nickname: 'ShadowKnight', username: 'shadowknight', value_sum: 18900 },
        { nickname: 'InfernalMage', username: 'infernal_mage', value_sum: 15320 },
        { nickname: 'ElvenRider', username: 'elvenrider', value_sum: 12840 },
        { nickname: 'FireSoul', username: 'firesoul', value_sum: 11120 },
        { nickname: 'RuneWarrior', username: 'runewarrior', value_sum: 9760 },
      ]);
      render('likes', [
        { nickname: 'HeartStorm', username: 'heartstorm', likes: 85200 },
        { nickname: 'PinkWizard', username: 'pinkwizard', likes: 73800 },
        { nickname: 'LoveDragon', username: 'lovedragon', likes: 61400 },
        { nickname: 'RubyFlame', username: 'rubyflame', likes: 58000 },
        { nickname: 'NightHeart', username: 'nightheart', likes: 52700 },
        { nickname: 'CrystalRose', username: 'crystalrose', likes: 48100 },
      ]);
      setLayouts(layouts);
      window.addEventListener('resize', () => setLayouts(layouts));
    } else {
      render('coins', []);
      render('likes', []);
      connect();
    }
    startPodiumReflections();
  </script>

</body>
